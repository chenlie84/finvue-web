<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>热搜追踪 · FinVue</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg0:#0A0B0E;--bg1:#11131A;--bg2:#181B24;--bg3:#1E2230;--border:#252836;--border2:#2E3347;--gold:#C8922A;--gold2:#E5B84A;--gold-dim:rgba(200,146,42,.12);--text0:#EAE6DD;--text1:#9B97A0;--text2:#5A566A;--green:#2DBD85;--red:#E05252;--blue:#4A90D9;--purple:#9B7FE8;--r:8px;--r2:12px;--font-display:'Playfair Display',Georgia,serif;--font-body:'Outfit',sans-serif;--font-mono:'JetBrains Mono',monospace;}
[data-theme="light"]{--bg0:#F8FAFC;--bg1:#FFFFFF;--bg2:#F1F5F9;--bg3:#E2E8F0;--border:#E2E8F0;--border2:#CBD5E1;--gold:#D97706;--gold2:#F59E0B;--gold-dim:rgba(217,119,6,.08);--text0:#1E293B;--text1:#64748B;--text2:#94A3B8;--green:#059669;--red:#DC2626;--blue:#2563EB;--purple:#7C3AED;}

*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--bg0);color:var(--text0);font-family:var(--font-body);font-size:14px;line-height:1.6;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px;}

.container{max-width:1400px;margin:0 auto;padding:24px;}

/* 顶部栏 */
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px;}
.back-btn{color:var(--text1);border:1px solid var(--border2);border-radius:var(--r);padding:8px 14px;background:var(--bg1);cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px;font-size:13px;}
.back-btn:hover{color:var(--gold);border-color:var(--gold);}
.topbar-right{display:flex;gap:8px;align-items:center;}
.theme-btn{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:var(--bg1);color:var(--text1);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .2s;}
.theme-btn:hover{background:var(--bg2);color:var(--gold);}
.theme-btn.active{background:var(--gold-dim);color:var(--gold);border-color:var(--gold);}
.fetch-btn{padding:8px 16px;border-radius:var(--r);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;border:none;display:inline-flex;align-items:center;gap:6px;background:var(--gold);color:#0A0B0E;}
.fetch-btn:hover{background:var(--gold2);}
.fetch-btn:disabled{opacity:.6;cursor:not-allowed;}

/* 页面标题和更新时间 */
.header-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.page-title{display:flex;align-items:center;gap:12px;}
h1{font-family:var(--font-display);font-size:28px;font-weight:600;color:var(--text0);}
.update-time{font-size:12px;color:var(--text2);background:var(--bg2);padding:6px 12px;border-radius:var(--r);display:inline-flex;align-items:center;gap:6px;}
.update-time .icon{color:var(--green);}

/* 搜索和筛选 */
.filter-row{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
.search-input{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);padding:10px 14px;color:var(--text0);font-size:13px;outline:none;transition:border-color .2s;width:260px;}
.search-input:focus{border-color:var(--gold);}
.search-input::placeholder{color:var(--text2);}
.platform-btns{display:flex;gap:6px;flex-wrap:wrap;}
.platform-btn{padding:6px 14px;border-radius:20px;font-size:12px;border:1px solid var(--border);color:var(--text1);cursor:pointer;transition:all .15s;background:var(--bg1);}
.platform-btn:hover{border-color:var(--gold);color:var(--gold);}
.platform-btn.active{background:var(--gold-dim);border-color:var(--gold);color:var(--gold);}
.platform-btn .icon{margin-right:4px;}

/* 状态提示 */
.status-bar{padding:10px 14px;background:var(--bg2);border-radius:var(--r);font-size:12px;color:var(--text1);margin-bottom:16px;display:none;}
.status-bar.success{background:rgba(45,189,133,.08);color:var(--green);display:block;}
.status-bar.error{background:rgba(224,82,82,.08);color:var(--red);display:block;}
.status-bar.loading{display:block;}

/* 热搜网格 */
.hotspot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
@media(max-width:1200px){.hotspot-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:700px){.hotspot-grid{grid-template-columns:1fr;}}

/* 平台卡片 */
.platform-card{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden;}
.card-header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:var(--bg2);border-bottom:1px solid var(--border);}
.card-title{font-size:14px;font-weight:600;color:var(--text0);display:flex;align-items:center;gap:8px;}
.card-title .icon{font-size:20px;}
.card-count{font-size:12px;color:var(--text2);font-family:var(--font-mono);}
.card-body{padding:12px;max-height:400px;overflow-y:auto;}

/* 热搜条目 */
.hotspot-item{padding:10px 12px;border-radius:var(--r);background:var(--bg2);margin-bottom:8px;transition:all .15s;}
.hotspot-item:hover{background:var(--bg3);}
.hotspot-item:last-child{margin-bottom:0;}
.item-row{display:flex;align-items:flex-start;gap:10px;}
.item-rank{font-family:var(--font-mono);font-size:13px;font-weight:600;min-width:24px;}
.item-rank.top1{color:var(--red);}
.item-rank.top2{color:var(--orange);}
.item-rank.top3{color:var(--gold);}
.item-content{flex:1;}
.item-title{font-size:13px;color:var(--text0);line-height:1.4;display:block;text-decoration:none;transition:color .15s;}
.item-title:hover{color:var(--gold);}
.item-title .arrow{color:var(--text2);margin-left:4px;font-size:11px;}
.item-meta{font-size:11px;color:var(--text2);margin-top:4px;display:flex;gap:8px;align-items:center;}
.item-hot{color:var(--red);font-family:var(--font-mono);}
.item-time{color:var(--text2);}

/* 空状态 */
.empty{text-align:center;color:var(--text1);padding:30px 20px;}
.empty-icon{font-size:36px;opacity:.4;margin-bottom:8px;}

/* 加载 */
.loading{text-align:center;padding:20px;color:var(--text1);}
.spinner{width:18px;height:18px;border:2px solid var(--border2);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;margin-right:8px;}
@keyframes spin{to{transform:rotate(360deg);}}

/* 抓取状态浮层 */
.fetch-overlay{position:fixed;top:0;left:0;right:0;background:var(--bg1);border-bottom:1px solid var(--border);padding:12px 24px;z-index:1000;display:none;align-items:center;gap:12px;}
.fetch-overlay.active{display:flex;}
.fetch-overlay .spinner{width:16px;height:16px;}
.fetch-overlay .text{font-size:13px;color:var(--text1);}

/* 橙色 */
:root{--orange:#F59E0B;}
</style>
</head>
<body>
<div class="container">
  <!-- 顶部栏 -->
  <div class="topbar">
    <button class="back-btn" onclick="location.href='/index.html'">← 返回主页</button>
    <div class="topbar-right">
      <button class="fetch-btn" id="fetchBtn" onclick="fetchHotspots()">
        <span>📥</span> 刷新热搜
      </button>
      <button class="theme-btn active" id="theme-dark" onclick="setTheme('dark')">🌙</button>
      <button class="theme-btn" id="theme-light" onclick="setTheme('light')">☀️</button>
    </div>
  </div>

  <!-- 标题和更新时间 -->
  <div class="header-row">
    <div class="page-title">
      <h1>热搜追踪</h1>
      <div class="update-time" id="updateTime">
        <span class="icon">●</span>
        <span id="updateTimeText">加载中...</span>
      </div>
    </div>
    <div style="font-size:13px;color:var(--text2);">
      共 <span id="totalCount" style="color:var(--gold);font-family:var(--font-mono);">--</span> 条热搜
    </div>
  </div>

  <!-- 搜索和平台筛选 -->
  <div class="filter-row">
    <input type="text" class="search-input" id="searchInput" placeholder="搜索关键词..." onkeydown="if(event.key==='Enter')searchHotspots()">
    <div class="platform-btns" id="platformBtns">
      <button class="platform-btn active" data-platform="" onclick="filterPlatform('')">全部</button>
    </div>
  </div>

  <!-- 状态提示 -->
  <div class="status-bar" id="statusBar"></div>

  <!-- 热搜网格 -->
  <div class="hotspot-grid" id="hotspotGrid">
    <div class="loading"><span class="spinner"></span> 正在加载热搜数据...</div>
  </div>
</div>

<!-- 抓取状态浮层 -->
<div class="fetch-overlay" id="fetchOverlay">
  <span class="spinner"></span>
  <span class="text">正在从各平台抓取热搜数据...</span>
</div>

<script>
// 辅助函数
const $ = id => document.getElementById(id);
const esc = v => String(v ?? "").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39'}[m]));
const fmt = n => Number(n || 0).toLocaleString("zh-CN");

// 状态
let state = {
  platforms: [],
  currentHotspots: [],
  selectedPlatform: "",
  lastFetchTime: null
};

// 平台元信息
const PLATFORM_META = {
  zhihu: { name: '知乎', icon: '📘' },
  bilibili: { name: 'B站', icon: '📺' },
  toutiao: { name: '头条', icon: '📰' },
  weibo: { name: '微博', icon: '🔥' },
  baidu: { name: '百度', icon: '🔍' },
  douyin: { name: '抖音', icon: '🎵' },
  cls: { name: '财联社', icon: '💰' },
  wallstreetcn: { name: '华尔街', icon: '📈' }
};

// 主题
function setTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('theme', theme);
  $('theme-dark').classList.toggle('active', theme === 'dark');
  $('theme-light').classList.toggle('active', theme === 'light');
}
const savedTheme = localStorage.getItem('theme') || 'dark';
setTheme(savedTheme);

// 加载平台列表
async function loadPlatforms() {
  try {
    const res = await fetch('/api/hotspot/platforms', { credentials: 'include' });
    if (res.status === 401) { location.href = '/index.html'; return; }
    const data = await res.json();
    state.platforms = data.platforms || [];
    renderPlatformBtns();
  } catch (e) {
    console.error('加载平台失败:', e);
  }
}

// 渲染平台按钮
function renderPlatformBtns() {
  const container = $('platformBtns');
  let html = '<button class="platform-btn active" data-platform="" onclick="filterPlatform(\'\')">全部</button>';
  
  state.platforms.forEach(p => {
    const meta = PLATFORM_META[p.id] || { name: p.name, icon: p.icon || '🔥' };
    html += `<button class="platform-btn" data-platform="${esc(p.id)}" onclick="filterPlatform('${esc(p.id)}')">${esc(meta.icon)} ${esc(meta.name)}</button>`;
  });
  
  container.innerHTML = html;
}

// 平台筛选
function filterPlatform(platform) {
  state.selectedPlatform = platform;
  document.querySelectorAll('.platform-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.platform === platform);
  });
  loadHotspots();
}

// 搜索
function searchHotspots() {
  loadHotspots();
}

// 加载热搜
async function loadHotspots() {
  $('hotspotGrid').innerHTML = '<div class="loading"><span class="spinner"></span> 正在加载...</div>';
  
  try {
    const platform = state.selectedPlatform;
    const keyword = $('searchInput').value.trim();
    let url = '/api/hotspot/current';
    if (platform) url += `?platform=${encodeURIComponent(platform)}`;
    if (keyword) url += `${platform ? '&' : '?'}keyword=${encodeURIComponent(keyword)}`;

    const res = await fetch(url, { credentials: 'include' });
    if (res.status === 401) { location.href = '/index.html'; return; }
    if (!res.ok) throw new Error(res.statusText);
    
    const data = await res.json();
    state.currentHotspots = data.items || [];
    
    renderHotspotGrid(data.byPlatform || {});
    updateStats(data.items || []);
    
  } catch (e) {
    $('hotspotGrid').innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div>加载失败: ${esc(e.message)}</div>`;
  }
}

// 渲染热搜网格
function renderHotspotGrid(byPlatform) {
  if (!Object.keys(byPlatform).length) {
    $('hotspotGrid').innerHTML = '<div class="empty"><div class="empty-icon">📭</div>暂无热搜数据，点击"刷新热搜"获取</div>';
    return;
  }

  let html = '';
  for (const [platformId, items] of Object.entries(byPlatform)) {
    const meta = PLATFORM_META[platformId] || state.platforms.find(p => p.id === platformId) || { name: platformId, icon: '🔥' };
    
    // 找最新的更新时间
    const latestTime = items.reduce((max, item) => {
      const t = new Date(item.lastSeenAt || 0);
      return t > max ? t : max;
    }, new Date(0));
    
    html += `
      <div class="platform-card">
        <div class="card-header">
          <div class="card-title">
            <span class="icon">${esc(meta.icon)}</span>
            ${esc(meta.name)}
          </div>
          <div class="card-count">${fmt(items.length)} 条</div>
        </div>
        <div class="card-body">
          ${items.slice(0, 20).map(item => {
            const rank = item.rank || 0;
            const rankClass = rank === 1 ? 'top1' : rank === 2 ? 'top2' : rank === 3 ? 'top3' : '';
            const timeStr = formatTime(item.lastSeenAt);
            return `
              <div class="hotspot-item">
                <div class="item-row">
                  <div class="item-rank ${rankClass}">#${rank || '--'}</div>
                  <div class="item-content">
                    ${item.url 
                      ? `<a class="item-title" href="${esc(item.url)}" target="_blank">${esc(item.title)}<span class="arrow">↗</span></a>`
                      : `<span class="item-title">${esc(item.title)}</span>`
                    }
                    <div class="item-meta">
                      ${item.hotValue ? `<span class="item-hot">${esc(item.hotValue)}</span>` : ''}
                      <span class="item-time">${timeStr}</span>
                    </div>
                  </div>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;
  }
  
  $('hotspotGrid').innerHTML = html;
}

// 格式化时间
function formatTime(isoStr) {
  if (!isoStr) return '';
  const d = new Date(isoStr);
  const now = new Date();
  const diff = now - d;
  
  if (diff < 60000) return '刚刚';
  if (diff < 3600000) return `${Math.floor(diff/60000)}分钟前`;
  if (diff < 86400000) return `${Math.floor(diff/3600000)}小时前`;
  return d.toLocaleDateString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

// 更新统计
function updateStats(items) {
  $('totalCount').textContent = fmt(items.length);
  
  if (items.length > 0) {
    const latestTime = items.reduce((max, item) => {
      const t = new Date(item.lastSeenAt || 0);
      return t > max ? t : max;
    }, new Date(0));
    
    $('updateTimeText').textContent = `更新于 ${formatTime(latestTime.toISOString())}`;
    state.lastFetchTime = latestTime;
  }
}

// 抓取热搜
async function fetchHotspots() {
  const btn = $('fetchBtn');
  const overlay = $('fetchOverlay');
  const statusBar = $('statusBar');
  
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner" style="width:14px;height:14px;border-width:1px;"></span> 抓取中...';
  overlay.classList.add('active');
  statusBar.className = 'status-bar loading';
  statusBar.innerHTML = '<span class="spinner"></span> 正在抓取热搜数据...';
  statusBar.style.display = 'block';

  try {
    // 收集需要抓取的平台（知乎、B站、头条）
    const platforms = ['zhihu', 'bilibili', 'toutiao'];
    
    const res = await fetch('/api/hotspot/fetch', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ platforms })
    });
    
    if (res.status === 401) { location.href = '/index.html'; return; }
    if (!res.ok) throw new Error(res.statusText);
    
    const data = await res.json();
    const result = data.result || {};
    
    overlay.classList.remove('active');
    statusBar.className = 'status-bar success';
    statusBar.innerHTML = `✓ 抓取完成！共获取 ${fmt(result.totalItems || 0)} 条热搜 (${result.successPlatforms?.join('、') || '--'})`;
    
    // 更新时间
    $('updateTimeText').textContent = '刚刚更新';
    
    // 刷新列表
    setTimeout(() => {
      statusBar.style.display = 'none';
      loadHotspots();
    }, 2000);
    
  } catch (e) {
    overlay.classList.remove('active');
    statusBar.className = 'status-bar error';
    statusBar.innerHTML = `✗ 抓取失败: ${esc(e.message)}`;
  }
  
  btn.disabled = false;
  btn.innerHTML = '<span>📥</span> 刷新热搜';
}

// 初始化
async function init() {
  await loadPlatforms();
  await loadHotspots();
}

init();
</script>
</body>
</html>
