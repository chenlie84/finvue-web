<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>运营数据中心 · FinVue</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
  /* 深色主题（默认） */
  :root {
    --bg0:#0A0B0E; --bg1:#11131A; --bg2:#181B24; --bg3:#1E2230;
    --border:#252836; --border2:#2E3347;
    --gold:#C8922A; --gold2:#E5B84A; --gold-dim:rgba(200,146,42,0.12);
    --text0:#EAE6DD; --text1:#9B97A0; --text2:#5A566A;
    --green:#2DBD85; --red:#E05252; --blue:#4A90D9; --purple:#9B7FE8;
    --r:8px; --r2:12px;
    --font-display:'Playfair Display',Georgia,serif;
    --font-body:'Outfit',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
    --chart-bg:#181B24;
  }
  
  /* 浅色主题 */
  [data-theme="light"] {
    --bg0:#F8FAFC; --bg1:#FFFFFF; --bg2:#F1F5F9; --bg3:#E2E8F0;
    --border:#E2E8F0; --border2:#CBD5E1;
    --gold:#D97706; --gold2:#F59E0B; --gold-dim:rgba(217,119,6,0.08);
    --text0:#1E293B; --text1:#64748B; --text2:#94A3B8;
    --green:#059669; --red:#DC2626; --blue:#2563EB; --purple:#7C3AED;
    --chart-bg:#F1F5F9;
  }
  
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;background:var(--bg0);color:var(--text0);font-family:var(--font-body);font-size:14px;line-height:1.6;}
  a{color:inherit;text-decoration:none;}
  ::-webkit-scrollbar{width:4px;height:4px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px;}

  .gold{color:var(--gold);} .green{color:var(--green);} .red{color:var(--red);} .blue{color:var(--blue);} .muted{color:var(--text1);} .mono{font-family:var(--font-mono);}
  .badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500;}
  .badge.green{background:rgba(45,189,133,0.12);color:var(--green);}
  [data-theme="light"] .badge.green{background:rgba(5,150,105,0.12);}
  .badge.gold{background:var(--gold-dim);color:var(--gold);}
  .badge.blue{background:rgba(74,144,217,0.12);color:var(--blue);}
  [data-theme="light"] .badge.blue{background:rgba(37,99,235,0.12);}

  /* 主题切换按钮 */
  .theme-toggle{position:fixed;top:16px;right:16px;z-index:1000;display:flex;gap:8px;}
  .theme-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--bg1);color:var(--text1);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .2s;}
  .theme-btn:hover{background:var(--bg2);color:var(--gold);}
  .theme-btn.active{background:var(--gold-dim);color:var(--gold);border-color:var(--gold);}

  .app-shell{display:flex;height:100vh;overflow:hidden;}
  .sidebar{width:200px;background:var(--bg1);border-right:1px solid var(--border);padding:16px 10px;display:flex;flex-direction:column;gap:1px;flex-shrink:0;}
  .s-section{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text2);padding:10px 8px 4px;margin-top:4px;}
  .nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--r);cursor:pointer;font-size:13px;color:var(--text1);transition:all .15s;}
  .nav-item:hover{color:var(--text0);background:var(--bg2);}
  .nav-item.active{color:var(--gold);background:var(--gold-dim);}
  .nav-item .ni{width:16px;text-align:center;flex-shrink:0;}
  
  .main-content{flex:1;overflow-y:auto;padding:28px 30px;}
  .page-title{font-family:var(--font-display);font-size:23px;font-weight:600;margin-bottom:4px;}
  .page-sub{color:var(--text1);font-size:13px;margin-bottom:24px;}
  
  .panel{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r2);padding:20px;}
  .panel-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .panel-title{font-size:14px;font-weight:500;}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;}
  .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px;}
  .g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
  .mb{margin-bottom:20px;}

  .kpi{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r2);padding:18px 20px;position:relative;overflow:hidden;}
  .kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--accent,var(--gold));}
  .kpi-lbl{font-size:11px;color:var(--text1);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;}
  .kpi-val{font-family:var(--font-mono);font-size:26px;font-weight:500;line-height:1;margin-bottom:6px;}
  .kpi-delta{font-size:12px;display:flex;align-items:center;gap:4px;}
  .kpi-ico{position:absolute;right:16px;top:14px;font-size:22px;opacity:.15;}

  .btn{padding:8px 16px;border-radius:var(--r);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;border:1px solid;display:inline-flex;align-items:center;gap:6px;}
  .btn-gold{background:var(--gold);color:#0A0B0E;border-color:var(--gold);}
  .btn-gold:hover{background:var(--gold2);}
  .btn-outline{background:transparent;border-color:var(--border2);color:var(--text1);}
  .btn-outline:hover{border-color:var(--gold);color:var(--gold);}

  .sel{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);padding:8px 12px;color:var(--text0);font-size:13px;outline:none;cursor:pointer;}
  .sel:focus{border-color:var(--gold);}
  
  .tbl{width:100%;border-collapse:collapse;}
  .tbl th{text-align:left;padding:9px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text2);background:var(--bg2);border-bottom:1px solid var(--border);}
  .tbl td{padding:11px 12px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle;}
  .tbl tr:last-child td{border-bottom:none;}
  .tbl tr:hover td{background:var(--bg2);}
  
  .filter-bar{display:flex;gap:12px;margin-bottom:20px;align-items:center;}
  
  .empty{padding:40px;text-align:center;color:var(--text2);}
  
  .calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
  .calendar-header{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:8px;}
  .calendar-day-header{padding:8px;text-align:center;font-size:12px;color:var(--text2);font-weight:500;}
  .calendar-day{background:var(--bg2);border:1px solid var(--border);border-radius:4px;padding:8px;min-height:80px;cursor:pointer;transition:all .15s;position:relative;}
  .calendar-day:hover{border-color:var(--gold);}
  .calendar-day.today{background:rgba(200,146,42,0.05);}
  .calendar-day.has-live{background:rgba(45,189,133,0.08);border-color:rgba(45,189,133,0.3);}
  .calendar-day.has-live:hover{border-color:var(--green);}
  .calendar-day.selected{border-color:var(--gold);background:var(--gold-dim);box-shadow:0 0 0 2px rgba(200,146,42,0.3);}
  .calendar-day.other-month{opacity:0.4;}
  .calendar-date{font-size:13px;font-weight:500;margin-bottom:4px;}
  .calendar-anchor{font-size:11px;color:var(--text1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;line-height:1.3;}
  .calendar-live-count{font-size:11px;color:var(--green);margin-top:2px;}
  
  .live-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:4px;}
  
  .video-title{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  
  .tab-content{display:none;}
  .tab-content.active{display:block;}

  /* 粉丝趋势样式 */
  .cohort-table{width:100%;border-collapse:collapse;}
  .cohort-table th{text-align:center;padding:9px 6px;font-size:11px;color:var(--text2);background:var(--bg2);border:1px solid var(--border);}
  .cohort-table td{text-align:center;padding:9px 6px;border:1px solid var(--border);font-size:12px;min-width:70px;}
  .cohort-table td:first-child{text-align:left;}
  .heat-cell{font-family:var(--font-mono);font-size:11px;}
  .progress-sm{height:4px;background:rgba(255,255,255,0.05);border-radius:2px;margin-top:4px;overflow:hidden;}
  .progress-sm-fill{height:100%;background:var(--gold);border-radius:2px;}
  .fans-chart{width:100%;height:300px;margin-bottom:20px;}
  
  .month-stats-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:16px;}
  .month-stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:12px;}
  .month-stat-label{font-size:11px;color:var(--text2);margin-bottom:4px;}
  .month-stat-value{font-family:var(--font-mono);font-size:16px;font-weight:500;}
  
  .history-chart{height:180px;display:flex;align-items:end;gap:4px;padding:12px;background:var(--bg2);border-radius:var(--r);position:relative;}
  .history-bar{flex:1;background:var(--gold-dim);border-radius:2px 2px 0 0;min-height:4px;position:relative;transition:height .3s;}
  .history-bar:hover{background:var(--gold);}
  .history-bar-label{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--text2);white-space:nowrap;}
  /* 折线图样式 */
  .line-chart-container{position:relative;height:200px;padding:16px;background:var(--bg2);border-radius:var(--r);}
  .line-chart-svg{width:100%;height:100%;}
  .line-chart-point{fill:var(--gold);stroke:var(--gold);stroke-width:2;cursor:pointer;}
  .line-chart-point:hover{fill:var(--gold2);stroke:var(--gold2);r:6;}
  .line-chart-line{fill:none;stroke:var(--gold);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .line-chart-area{fill:url(#goldGradient);opacity:0.3;}
  .line-chart-label{font-size:10px;fill:var(--text2);text-anchor:middle;}
  .line-chart-title{font-size:12px;fill:var(--text1);font-weight:500;}
  .line-chart-tooltip{position:absolute;background:var(--bg0);border:1px solid var(--border);padding:4px 8px;border-radius:var(--r);font-size:11px;color:var(--text1);pointer-events:none;z-index:10;white-space:nowrap;}
  
  .lbl{font-size:12px;color:var(--text1);margin-bottom:6px;display:block;}
  .inp{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);padding:9px 12px;color:var(--text0);font-size:13px;outline:none;transition:border-color .2s;width:100%;}
  .inp:focus{border-color:var(--gold);}
  .inp::placeholder{color:var(--text2);}
  .textarea{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);padding:10px 12px;color:var(--text0);font-size:13px;outline:none;resize:vertical;line-height:1.6;transition:border-color .2s;width:100%;}
  .textarea:focus{border-color:var(--gold);}
  .textarea::placeholder{color:var(--text2);}
</style>
</head>
<body>
<!-- 主题切换按钮 -->
<div class="theme-toggle">
  <button class="theme-btn active" id="theme-dark" onclick="setTheme('dark')" title="深色主题">🌙</button>
  <button class="theme-btn" id="theme-light" onclick="setTheme('light')" title="浅色主题">☀️</button>
</div>
<div class="app-shell">
  <!-- 侧边栏 -->
  <nav class="sidebar">
    <div class="s-section">数据报表</div>
    <div class="nav-item active" onclick="switchTab('weekly', this)">
      <span class="ni">📊</span>
      <span>主播周报</span>
    </div>
    <div class="nav-item" onclick="switchTab('monthly', this)">
      <span class="ni">📈</span>
      <span>主播月报</span>
    </div>
    <div class="nav-item" onclick="switchTab('fans-trend', this)">
      <span class="ni">👥</span>
      <span>粉丝趋势</span>
    </div>
    <div class="nav-item" onclick="switchTab('calendar', this)">
      <span class="ni">📅</span>
      <span>直播日历</span>
    </div>
    <div class="s-section">其他</div>
    <div class="nav-item" onclick="location.href='/'">
      <span class="ni">←</span>
      <span>返回首页</span>
    </div>
  </nav>

  <!-- 主内容 -->
  <main class="main-content">
    <!-- 状态栏 -->
    <div class="page-sub" id="dataStatus">正在加载数据...</div>

    <!-- 周报 -->
    <div id="tab-weekly" class="tab-content active">
      <h1 class="page-title">主播周报</h1>
      <div class="filter-bar">
        <select id="week-selector" class="sel" onchange="loadWeeklyReport()"></select>
        <select id="weekly-account-filter" class="sel" onchange="loadWeeklyReport()">
          <option value="">全部主播</option>
        </select>
      </div>
      <div id="weekly-content"></div>
    </div>

    <!-- 月报 -->
    <div id="tab-monthly" class="tab-content">
      <h1 class="page-title">主播月报</h1>
      <div class="filter-bar">
        <select id="month-selector" class="sel" onchange="loadMonthlyReport()"></select>
        <select id="monthly-account-filter" class="sel" onchange="loadMonthlyReport()">
          <option value="">全部主播</option>
        </select>
      </div>
      <div id="monthly-content"></div>
    </div>

    <!-- 直播日历 -->
    <div id="tab-calendar" class="tab-content">
      <h1 class="page-title">直播日历</h1>
      <div class="filter-bar">
        <select id="calendar-account-filter" class="sel" onchange="loadCalendar()">
          <option value="">全部主播</option>
        </select>
        <button class="btn btn-outline" onclick="prevMonth()">上一月</button>
        <span id="calendar-month-label" class="muted" style="font-size:14px;"></span>
        <button class="btn btn-outline" onclick="nextMonth()">下一月</button>
      </div>
      <div class="panel mb">
        <div class="calendar-header">
          <div class="calendar-day-header">周一</div>
          <div class="calendar-day-header">周二</div>
          <div class="calendar-day-header">周三</div>
          <div class="calendar-day-header">周四</div>
          <div class="calendar-day-header">周五</div>
          <div class="calendar-day-header">周六</div>
          <div class="calendar-day-header">周日</div>
        </div>
        <div id="calendar-grid" class="calendar-grid"></div>
      </div>
      <div id="calendar-detail" class="panel mb"></div>
      
      <!-- 手工添加直播记录 -->
      <div class="panel">
        <div class="panel-hd">
          <div class="panel-title">📝 手工添加直播记录</div>
          <span class="muted" style="font-size:12px;">点击日历日期自动填充</span>
        </div>
        <div class="g2">
          <div>
            <label class="lbl">主播账号</label>
            <select id="add-live-account" class="sel">
              <option value="">选择主播</option>
            </select>
          </div>
          <div>
            <label class="lbl">直播日期 <span class="muted">(点击日历选择)</span></label>
            <input type="date" id="add-live-date" class="inp" style="width:100%;background:var(--bg2);color:var(--text1);" readonly>
          </div>
        </div>
        <div class="g2">
          <div>
            <label class="lbl">开播时间</label>
            <input type="time" id="add-live-time" class="inp" style="width:100%;">
          </div>
          <div>
            <label class="lbl">直播时长(分钟)</label>
            <input type="number" id="add-live-duration" class="inp" style="width:100%;" placeholder="如: 60">
          </div>
        </div>
        <div style="margin-bottom:12px;">
          <label class="lbl">直播标题(可选)</label>
          <input type="text" id="add-live-title" class="inp" style="width:100%;" placeholder="直播标题">
        </div>
        <div style="margin-bottom:12px;">
          <label class="lbl">备注(可选)</label>
          <textarea id="add-live-notes" class="textarea" rows="2" placeholder="备注信息"></textarea>
        </div>
        <div style="display:flex;gap:12px;">
          <button class="btn btn-gold" onclick="addLiveRecord()">添加记录</button>
          <span id="add-live-result" class="muted"></span>
        </div>
      </div>
    </div>

    <!-- 粉丝趋势 -->
    <div id="tab-fans-trend" class="tab-content">
      <h1 class="page-title">粉丝趋势分析</h1>
      <div class="page-sub" id="fans-trend-subtitle">TOP200 粉丝全员趋势看板</div>
      <div class="filter-bar">
        <select id="fans-trend-anchor" class="sel" onchange="loadFansTrend()">
          <option value="">选择主播</option>
        </select>
        <button class="btn btn-outline" onclick="exportFansTrendHTML()">导出 HTML</button>
      </div>
      <div id="fans-trend-content">
        <div class="empty">请选择主播查看粉丝趋势分析</div>
      </div>
    </div>
  </main>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmt = n => Number(n || 0).toLocaleString('zh-CN');

// 主题切换
function setTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('theme', theme);
  // 更新按钮状态
  $('theme-dark').classList.toggle('active', theme === 'dark');
  $('theme-light').classList.toggle('active', theme === 'light');
  // 刷新图表以适应新主题
  if (typeof refreshCharts === 'function') refreshCharts();
}

// 初始化主题（从localStorage读取）
function initTheme() {
  const saved = localStorage.getItem('theme') || 'dark';
  setTheme(saved);
}

// 获取当前主题的颜色（用于ECharts）
function getThemeColors() {
  const isLight = document.documentElement.getAttribute('data-theme') === 'light';
  return {
    bg: isLight ? '#FFFFFF' : '#181B24',
    border: isLight ? '#E2E8F0' : '#252836',
    text: isLight ? '#1E293B' : '#EAE6DD',
    textMuted: isLight ? '#64748B' : '#9B97A0',
    textDim: isLight ? '#94A3B8' : '#5A566A',
    gold: isLight ? '#D97706' : '#C8922A',
    gold2: isLight ? '#F59E0B' : '#E5B84A',
    blue: isLight ? '#2563EB' : '#4A90D9',
    green: isLight ? '#059669' : '#2DBD85'
  };
}

// 刷新所有图表
function refreshCharts() {
  Object.keys(chartInstances).forEach(id => {
    if (chartInstances[id]) {
      // 重新渲染图表（需要重新获取数据，这里简化处理）
      chartInstances[id].resize();
    }
  });
  // 如果当前是月报，重新加载以更新图表颜色
  if (document.querySelector('#tab-monthly.active')) {
    loadMonthlyReport();
  }
}

// 格式化时间：将 ISO 或 datetime 格式转为 "MM-DD HH:mm"
const fmtTime = t => {
  if (!t) return '-';
  // 替换 ISO 格式的 T 为空格
  const s = String(t).replace('T', ' ');
  // 提取 "MM-DD HH:mm" 部分（索引 5-16，共11字符）
  return s.slice(5, 16);
};

let calendarDate = new Date();
let selectedCalendarDay = null;

function switchTab(tabId, el) {
  document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  $('tab-' + tabId).classList.add('active');

  if (tabId === 'weekly') loadWeeklyReport();
  if (tabId === 'monthly') loadMonthlyReport();
  if (tabId === 'calendar') loadCalendar();
  if (tabId === 'fans-trend') loadFansTrend();
}

// 加载主播列表
async function loadAccounts() {
  try {
    const res = await fetch('/api/operation/accounts', { credentials: 'include' });
    if (!res.ok) {
      const text = await res.text();
      throw new Error(`HTTP ${res.status}: ${text.slice(0,100)}`);
    }
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || '获取主播列表失败');

    const accounts = data.accounts || [];
    const options = accounts.map(a => `<option value="${esc(a.account)}">${esc(a.account)} (${a.live_count || 0}场)</option>`).join('');

    $('weekly-account-filter').innerHTML = '<option value="">全部主播</option>' + options;
    $('monthly-account-filter').innerHTML = '<option value="">全部主播</option>' + options;
    $('calendar-account-filter').innerHTML = '<option value="">全部主播</option>' + options;
    $('add-live-account').innerHTML = '<option value="">选择主播</option>' + options;

    // 加载粉丝趋势主播列表（从客户会话表获取）
    loadFansTrendAnchors();

    const total = data.total_count || 0;
    const range = data.data_range || {};
    if (total > 0 && range.min && range.max) {
      $('dataStatus').textContent = `共 ${total} 条直播数据 · 时间范围: ${range.min.split(' ')[0]} ~ ${range.max.split(' ')[0]}`;
    } else {

// 初始化周选择器
function initWeekSelector() {
  const today = new Date();
  const options = [];
  
  const getMonday = (d) => {
    const date = new Date(d);
    const day = date.getDay();
    const diff = date.getDate() - day + (day === 0 ? -6 : 1);
    date.setDate(diff);
    return date;
  };
  
  const fmtDate = (d) => `${d.getMonth() + 1}/${d.getDate()}`;
  const thisMonday = getMonday(today);
  
  for (let i = 0; i < 20; i++) {
    const monday = new Date(thisMonday);
    monday.setDate(monday.getDate() - i * 7);
    const sunday = new Date(monday);
    sunday.setDate(sunday.getDate() + 6);
    
    const label = i === 0 
      ? `${fmtDate(monday)} ~ ${fmtDate(sunday)} (本周)`
      : `${fmtDate(monday)} ~ ${fmtDate(sunday)}`;
    options.push(`<option value="${-i * 7}">${label}</option>`);
  }
  
  $('week-selector').innerHTML = options.join('');
}

// 初始化月选择器
function initMonthSelector() {
  const today = new Date();
  const options = [];
  for (let i = 0; i < 14; i++) {
    const d = new Date(today.getFullYear(), today.getMonth() - i, 1);
    const monthStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    options.push(`<option value="${monthStr}">${monthStr}</option>`);
  }
  $('month-selector').innerHTML = options.join('');
}

// 加载周报
async function loadWeeklyReport() {
  const weekOffset = $('week-selector').value || '0';
  const account = $('weekly-account-filter').value;
  
  const today = new Date();
  const weekStart = new Date(today);
  weekStart.setDate(today.getDate() - today.getDay() + 1 + parseInt(weekOffset));
  const weekStartStr = weekStart.toISOString().split('T')[0];
  
  try {
    const params = new URLSearchParams();
    if (account) params.set('account', account);
    params.set('weekStart', weekStartStr);
    
    const res = await fetch('/api/operation/weekly-report?' + params, { credentials: 'include' });
    if (!res.ok) {
      const text = await res.text();
      throw new Error(`HTTP ${res.status}: ${text.slice(0,100)}`);
    }
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || '获取周报失败');
    
    renderWeeklyReport(data);
  } catch (e) {
    $('weekly-content').innerHTML = `<div class="panel"><div class="empty">${esc(e.message)}</div></div>`;
  }
}

                  <td class="mono">${Number(v.interaction_rate || 0).toFixed(1)}%</td>
                  <td class="green mono">${fmt(v.follow_count)}</td>
                </tr>
              `).join('')}
            </table>
          </details>
        ` : ''}
      </div>
    `;
  }

  $('monthly-content').innerHTML = html;
  
  // 初始化所有图表
  setTimeout(() => {
    chartsToInit.forEach(c => renderAnchorChart(c.id, c.data));
  }, 50);
  
  // 添加折线图tooltip交互
  const tooltip = document.getElementById('line-tooltip');
  const points = document.querySelectorAll('.line-chart-point');
  points.forEach(point => {
    point.addEventListener('mouseenter', (e) => {
      if (!tooltip) return;
      const day = point.getAttribute('data-day');
      const acu = point.getAttribute('data-acu');
      const count = point.getAttribute('data-count');
      tooltip.innerHTML = `${day?.slice(5) || ''}日: ${fmt(acu)} 人 · ${count}场直播`;
      tooltip.style.display = 'block';
      tooltip.style.left = e.offsetX + 'px';
      tooltip.style.top = (e.offsetY - 30) + 'px';
    });
    point.addEventListener('mouseleave', () => {
      if (tooltip) tooltip.style.display = 'none';
    });
  });
}

// 日历相关
function prevMonth() {
  calendarDate.setMonth(calendarDate.getMonth() - 1);
  loadCalendar();
}

function nextMonth() {
  calendarDate.setMonth(calendarDate.getMonth() + 1);
  loadCalendar();
}

async function loadCalendar() {
  const account = $('calendar-account-filter').value;
  const year = calendarDate.getFullYear();
  const month = calendarDate.getMonth();

  $('calendar-month-label').textContent = `${year}年${month + 1}月`;

  try {
    const params = new URLSearchParams();
    params.set('year', year);
    params.set('month', month + 1);
    if (account) params.set('account', account);

    const res = await fetch('/api/operation/calendar?' + params, { credentials: 'include' });
    if (!res.ok) {
      const text = await res.text();
      throw new Error(`HTTP ${res.status}: ${text.slice(0,100)}`);
    }
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || '获取日历失败');

    renderCalendar(data, year, month);
  } catch (e) {
    $('calendar-grid').innerHTML = `<div class="empty" style="grid-column:span 7;">${esc(e.message)}</div>`;
  }
}

function renderCalendar(data, year, month) {
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const firstDay = new Date(year, month, 1).getDay();
  const startOffset = firstDay === 0 ? 6 : firstDay - 1; // 周一为第一天

  const liveData = data.days || {};
  const today = new Date();

  let html = '';

  // 上月填充
  const prevMonthDays = new Date(year, month, 0).getDate();
  for (let i = startOffset - 1; i >= 0; i--) {
    const day = prevMonthDays - i;
    html += `<div class="calendar-day other-month"><div class="calendar-date">${day}</div></div>`;
  }

  // 当月
  for (let day = 1; day <= daysInMonth; day++) {
    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    const dayData = liveData[dateStr] || {};
    const isToday = today.getFullYear() === year && today.getMonth() === month && today.getDate() === day;
    const hasLive = dayData.count > 0;

    const classes = ['calendar-day'];
    if (isToday) classes.push('today');
    if (hasLive) classes.push('has-live');

    // 收集主播名字和开播时间
    let anchorInfo = '';
    if (hasLive && dayData.lives) {
      // 按开播时间排序
      const sortedLives = dayData.lives.sort((a, b) => {
        const timeA = a.start_time || '';
        const timeB = b.start_time || '';
        return timeA.localeCompare(timeB);
      });
      
      // 显示前3场直播的信息
      const displayLives = sortedLives.slice(0, 3);
      anchorInfo = displayLives.map(l => {
        const time = l.start_time ? l.start_time.split(' ')[1]?.slice(0, 5) || '' : '';
        const timeStr = time ? ` ${time}` : '';
        return `<div class="calendar-anchor">${esc(l.account)}${timeStr}</div>`;
      }).join('');
      
      if (sortedLives.length > 3) {
        anchorInfo += `<div class="calendar-anchor muted">+${sortedLives.length - 3}场</div>`;
      }
    }

    html += `
      <div class="${classes.join(' ')}" onclick="showDayDetail(event, '${dateStr}', ${JSON.stringify(dayData).replace(/"/g, '&quot;')})">
        <div class="calendar-date">${day}</div>
        ${anchorInfo}
        ${hasLive ? `<div class="calendar-live-count">${dayData.count}场</div>` : ''}
      </div>
    `;
  }

  // 下月填充
  const totalCells = startOffset + daysInMonth;
  const remaining = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
  for (let i = 1; i <= remaining; i++) {
    html += `<div class="calendar-day other-month"><div class="calendar-date">${i}</div></div>`;
  }

  $('calendar-grid').innerHTML = html;
  $('calendar-detail').innerHTML = '<div class="muted">点击日期查看直播详情</div>';
}

function showDayDetail(event, dateStr, dayData) {
  // 移除之前的选中状态
  document.querySelectorAll('.calendar-day.selected').forEach(el => el.classList.remove('selected'));
  // 给当前点击的日期添加选中状态
  if (event && event.currentTarget) {
    event.currentTarget.classList.add('selected');
  }
  
  // 自动填充手工添加表单的日期字段
  $('add-live-date').value = dateStr;

  if (!dayData || !dayData.lives || !dayData.lives.length) {
    $('calendar-detail').innerHTML = `<div class="muted">${dateStr} 无直播记录</div>`;
    return;
  }
  
  let html = `
    <div class="panel-hd">
      <div class="panel-title">${dateStr} 直播明细</div>
      <span class="badge gold">${dayData.count} 场</span>
    </div>
    <table class="tbl">
      <tr><th>主播</th><th>开播时间</th><th>时长</th><th>观看</th><th>涨粉</th><th>来源</th></tr>
      ${dayData.lives.map(l => `
        <tr>
          <td>${esc(l.account)}</td>
          <td class="mono">${(l.start_time || '').split(' ')[1]?.slice(0, 5) || '-'}</td>
          <td class="mono">${l.duration || 0}分</td>
          <td class="mono">${fmt(l.watch_ucnt)}</td>
          <td class="green mono">${fmt(l.follow_ucnt)}</td>
          <td>${l.notes && l.notes.includes("[手工录入]") ? "<button onclick=deleteLiveRecord('" + l.room_id + "') style=font-size:10px;padding:2px 6px;background:var(--red);border:none;color:#fff;border-radius:4px;cursor:pointer;>删除</button>" : "<span class=muted style=font-size:10px;>CSV导入</span>"}</td>
        </tr>
      `).join('')}
    </table>
  `;
  
  $('calendar-detail').innerHTML = html;
}

// 删除直播记录
async function deleteLiveRecord(roomId) {
  if (!confirm('确定删除该直播记录？')) return;

  try {
    const res = await fetch('/api/operation/live/' + roomId, {
      method: 'DELETE',
      credentials: 'include'
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || '删除失败');

    // 刷新日历
    loadCalendar();
    $('calendar-detail').innerHTML = '<div style="color:var(--green);padding:8px;">已删除</div>';
  } catch (e) {
    alert('删除失败: ' + e.message);
  }
}

// 热力图颜色计算 (复刻top200的紫色系)
function heatColor(value) {
  if (value <= 0) return '';
  const alpha = Math.max(0.05, Math.min(0.82, value / 100 * 0.82));
  const textColor = value >= 45 ? 'var(--text0)' : 'var(--text1)';
  return `background: rgba(99,102,241,${alpha}); color: ${textColor}`;
}

// 加载粉丝趋势数据
async function loadFansTrend() {
  const anchor = $('fans-trend-anchor').value;
  if (!anchor) {
    $('fans-trend-content').innerHTML = '<div class="empty">请选择主播查看粉丝趋势分析</div>';
    return;
  }

  $('fans-trend-content').innerHTML = '<div class="muted">正在加载...</div>';

  try {
    const res = await fetch(`/api/fans-trend/top200?anchorName=${encodeURIComponent(anchor)}`, { credentials: 'include' });
    if (!res.ok) {
      if (res.status === 401) {
        $('fans-trend-content').innerHTML = '<div class="empty">请先<a href="/index.html" style="color:var(--gold);">登录</a></div>';
        return;
      }
      const errData = await res.json().catch(() => ({}));
      throw new Error(errData.error || '加载失败');
    }
    const data = await res.json();
    renderFansTrend(data);
  } catch (e) {
    $('fans-trend-content').innerHTML = `<div class="empty">加载失败: ${esc(e.message)}</div>`;
  }
}

        <div class="kpi-lbl">新晋活跃粉 (New)</div>
        <div class="kpi-val mono gold">${fmt(stats.new_active || 0)}</div>
        <div class="kpi-delta">1-3场且活跃</div>
      </div>

            </td>
          </tr>
        `).join('')}

    </div>

    <!-- 核心粉丝同期群 (≥10场) -->
    <div class="panel mb">
      <div class="panel-hd"><div class="panel-title">2. 核心粉丝同期群 (≥10场)</div><span class="muted">死忠粉+高频粉的留存分析</span></div>
      ${renderCohortTable(coreCohort, 6)}

    <!-- 中频以上粉丝同期群 (≥4场) -->

// 渲染同期群表格
function renderCohortTable(rows, maxMonths) {
  if (!rows || rows.length === 0) {
    return '<div class="empty">暂无足够数据</div>';
  }

  // 计算最大月份数
  const monthCount = maxMonths;

  let html = `
    <div style="overflow-x:auto;">
      <table class="cohort-table">
        <tr>
          <th>Cohort</th>
          <th>基数</th>
          ${Array.from({length: monthCount}, (_, i) => `<th>T+${i}M</th>`).join('')}
        </tr>
        ${rows.map(row => `
          <tr>
            <td class="mono">${esc(row.cohort)}</td>
            <td class="mono" style="color:var(--gold2);font-weight:600">${fmt(row.base)}</td>
            ${(row.cells || []).slice(0, monthCount).map(cell => {
              const style = heatColor(cell.value || 0);
              return `<td class="heat-cell" ${style ? `style="${style}"` : ''}>${(cell.value || 0).toFixed(1)}%</td>`;
            }).join('')}
          </tr>
        `).join('')}
      </table>
    </div>
  `;
  return html;
}
