<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>运营数据中心 · FinVue</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
  /* 深色主题（默认） */
  :root {
    --bg0:#0A0B0E; --bg1:#11131A; --bg2:#181B24; --bg3:#1E2230;
    --border:#252836; --border2:#2E3347;
    --gold:#C8922A; --gold2:#E5B84A; --gold-dim:rgba(200,146,42,0.12);
    --text0:#EAE6DD; --text1:#9B97A0; --text2:#5A566A;
    --green:#2DBD85; --red:#E05252; --blue:#4A90D9; --purple:#9B7FE8;
    --r:8px; --r2:12px;
    --font-display:'Playfair Display',Georgia,serif;
    --font-body:'Outfit',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
    --chart-bg:#181B24;
  }
  
  /* 浅色主题 */
  [data-theme="light"] {
    --bg0:#F8FAFC; --bg1:#FFFFFF; --bg2:#F1F5F9; --bg3:#E2E8F0;
    --border:#E2E8F0; --border2:#CBD5E1;
    --gold:#D97706; --gold2:#F59E0B; --gold-dim:rgba(217,119,6,0.08);
    --text0:#1E293B; --text1:#64748B; --text2:#94A3B8;
    --green:#059669; --red:#DC2626; --blue:#2563EB; --purple:#7C3AED;
    --chart-bg:#F1F5F9;
  }
  
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;background:var(--bg0);color:var(--text0);font-family:var(--font-body);font-size:14px;line-height:1.6;}
  a{color:inherit;text-decoration:none;}
  ::-webkit-scrollbar{width:4px;height:4px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px;}

  .gold{color:var(--gold);} .green{color:var(--green);} .red{color:var(--red);} .blue{color:var(--blue);} .muted{color:var(--text1);} .mono{font-family:var(--font-mono);}
  .badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500;}
  .badge.green{background:rgba(45,189,133,0.12);color:var(--green);}
  [data-theme="light"] .badge.green{background:rgba(5,150,105,0.12);}
  .badge.gold{background:var(--gold-dim);color:var(--gold);}
  .badge.blue{background:rgba(74,144,217,0.12);color:var(--blue);}
  [data-theme="light"] .badge.blue{background:rgba(37,99,235,0.12);}

  /* 主题切换按钮 */
  .theme-btn{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:var(--bg1);color:var(--text1);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .2s;}
  .theme-btn:hover{background:var(--bg2);color:var(--gold);}
  .theme-btn.active{background:var(--gold-dim);color:var(--gold);border-color:var(--gold);}

  .app-shell{display:flex;height:100vh;overflow:hidden;}
  .sidebar{width:200px;background:var(--bg1);border-right:1px solid var(--border);padding:16px 10px;display:flex;flex-direction:column;gap:1px;flex-shrink:0;}
  .s-section{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text2);padding:10px 8px 4px;margin-top:4px;}
  .nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--r);cursor:pointer;font-size:13px;color:var(--text1);transition:all .15s;}
  .nav-item:hover{color:var(--text0);background:var(--bg2);}
  .nav-item.active{color:var(--gold);background:var(--gold-dim);}
  .nav-item .ni{width:16px;text-align:center;flex-shrink:0;}
  
  .main-content{flex:1;overflow-y:auto;padding:28px 30px;}
  .page-title{font-family:var(--font-display);font-size:23px;font-weight:600;margin-bottom:4px;}
  .page-sub{color:var(--text1);font-size:13px;margin-bottom:24px;}
  
  .panel{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r2);padding:20px;}
  .panel-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .panel-title{font-size:14px;font-weight:500;}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;}
  .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px;}
  .g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
  .mb{margin-bottom:20px;}

  .kpi{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r2);padding:18px 20px;position:relative;overflow:hidden;}
  .kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--accent,var(--gold));}
  .kpi-lbl{font-size:11px;color:var(--text1);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;}
  .kpi-val{font-family:var(--font-mono);font-size:26px;font-weight:500;line-height:1;margin-bottom:6px;}
  .kpi-delta{font-size:12px;display:flex;align-items:center;gap:4px;}
  .kpi-ico{position:absolute;right:16px;top:14px;font-size:22px;opacity:.15;}

  .btn{padding:8px 16px;border-radius:var(--r);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;border:1px solid;display:inline-flex;align-items:center;gap:6px;}
  .btn-gold{background:var(--gold);color:#0A0B0E;border-color:var(--gold);}
  .btn-gold:hover{background:var(--gold2);}
  .btn-outline{background:transparent;border-color:var(--border2);color:var(--text1);}
  .btn-outline:hover{border-color:var(--gold);color:var(--gold);}

  .sel{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);padding:8px 12px;color:var(--text0);font-size:13px;outline:none;cursor:pointer;}
  .sel:focus{border-color:var(--gold);}
  
  .tbl{width:100%;border-collapse:collapse;}
  .tbl th{text-align:left;padding:9px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text2);background:var(--bg2);border-bottom:1px solid var(--border);}
  .tbl td{padding:11px 12px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle;}
  .tbl tr:last-child td{border-bottom:none;}
  .tbl tr:hover td{background:var(--bg2);}
  
  .filter-bar{display:flex;gap:12px;margin-bottom:20px;align-items:center;}
  
  .empty{padding:40px;text-align:center;color:var(--text2);}
  
  .calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
  .calendar-header{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:8px;}
  .calendar-day-header{padding:8px;text-align:center;font-size:12px;color:var(--text2);font-weight:500;}
  .calendar-day{background:var(--bg2);border:1px solid var(--border);border-radius:4px;padding:8px;min-height:80px;cursor:pointer;transition:all .15s;position:relative;}
  .calendar-day:hover{border-color:var(--gold);}
  .calendar-day.today{background:rgba(200,146,42,0.05);}
  .calendar-day.has-live{background:rgba(45,189,133,0.08);border-color:rgba(45,189,133,0.3);}
  .calendar-day.has-live:hover{border-color:var(--green);}
  .calendar-day.selected{border-color:var(--gold);background:var(--gold-dim);box-shadow:0 0 0 2px rgba(200,146,42,0.3);}
  .calendar-day.other-month{opacity:0.4;}
  .calendar-date{font-size:13px;font-weight:500;margin-bottom:4px;}
  .calendar-anchor{font-size:11px;color:var(--text1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;line-height:1.3;}
  .calendar-live-count{font-size:11px;color:var(--green);margin-top:2px;}
  
  .live-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:4px;}
  
  .video-title{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  
  .tab-content{display:none;}
  .tab-content.active{display:block;}

  /* 粉丝趋势样式 */
  .cohort-table{width:100%;border-collapse:collapse;}
  .cohort-table th{text-align:center;padding:9px 6px;font-size:11px;color:var(--text2);background:var(--bg2);border:1px solid var(--border);}
  .cohort-table td{text-align:center;padding:9px 6px;border:1px solid var(--border);font-size:12px;min-width:70px;}
  .cohort-table td:first-child{text-align:left;}
  .heat-cell{font-family:var(--font-mono);font-size:11px;}
  .progress-sm{height:4px;background:rgba(255,255,255,0.05);border-radius:2px;margin-top:4px;overflow:hidden;}
  .progress-sm-fill{height:100%;background:var(--gold);border-radius:2px;}
  .fans-chart{width:100%;height:300px;margin-bottom:20px;}
  
  .month-stats-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:16px;}
  .month-stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:12px;}
  .month-stat-label{font-size:11px;color:var(--text2);margin-bottom:4px;}
  .month-stat-value{font-family:var(--font-mono);font-size:16px;font-weight:500;}
  
  .history-chart{height:180px;display:flex;align-items:end;gap:4px;padding:12px;background:var(--bg2);border-radius:var(--r);position:relative;}
  .history-bar{flex:1;background:var(--gold-dim);border-radius:2px 2px 0 0;min-height:4px;position:relative;transition:height .3s;}
  .history-bar:hover{background:var(--gold);}
  .history-bar-label{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--text2);white-space:nowrap;}
  /* 折线图样式 */
  .line-chart-container{position:relative;height:200px;padding:16px;background:var(--bg2);border-radius:var(--r);}
  .line-chart-svg{width:100%;height:100%;}
  .line-chart-point{fill:var(--gold);stroke:var(--gold);stroke-width:2;cursor:pointer;}
  .line-chart-point:hover{fill:var(--gold2);stroke:var(--gold2);r:6;}
  .line-chart-line{fill:none;stroke:var(--gold);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .line-chart-area{fill:url(#goldGradient);opacity:0.3;}
  .line-chart-label{font-size:10px;fill:var(--text2);text-anchor:middle;}
  .line-chart-title{font-size:12px;fill:var(--text1);font-weight:500;}
  .line-chart-tooltip{position:absolute;background:var(--bg0);border:1px solid var(--border);padding:4px 8px;border-radius:var(--r);font-size:11px;color:var(--text1);pointer-events:none;z-index:10;white-space:nowrap;}
  
  .lbl{font-size:12px;color:var(--text1);margin-bottom:6px;display:block;}
  .inp{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);padding:9px 12px;color:var(--text0);font-size:13px;outline:none;transition:border-color .2s;width:100%;}
  .inp:focus{border-color:var(--gold);}
  .inp::placeholder{color:var(--text2);}
  .textarea{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);padding:10px 12px;color:var(--text0);font-size:13px;outline:none;resize:vertical;line-height:1.6;transition:border-color .2s;width:100%;}
  .textarea:focus{border-color:var(--gold);}
  .textarea::placeholder{color:var(--text2);}
</style>
</head>
<body>
<div class="app-shell">
  <!-- 侧边栏 -->
  <nav class="sidebar">
    <div class="s-section">数据报表</div>
    <div class="nav-item active" onclick="switchTab('weekly', this)">
      <span class="ni">📊</span>
      <span>主播周报</span>
    </div>
    <div class="nav-item" onclick="switchTab('monthly', this)">
      <span class="ni">📈</span>
      <span>主播月报</span>
    </div>
    <div class="nav-item" onclick="switchTab('fans-trend', this)">
      <span class="ni">👥</span>
      <span>粉丝趋势</span>
    </div>
    <div class="nav-item" onclick="switchTab('calendar', this)">
      <span class="ni">📅</span>
      <span>直播日历</span>
    </div>
    <div class="nav-item" onclick="switchTab('live-details', this)">
      <span class="ni">📋</span>
      <span>直播明细</span>
    </div>
    <div class="s-section">其他</div>
    <div class="nav-item" onclick="location.href='/'">
      <span class="ni">←</span>
      <span>返回首页</span>
    </div>
    <div style="margin-top:auto;padding-top:10px;display:flex;gap:6px;justify-content:center;">
      <button class="theme-btn active" id="theme-dark" onclick="setTheme('dark')" title="深色主题">🌙</button>
      <button class="theme-btn" id="theme-light" onclick="setTheme('light')" title="浅色主题">☀️</button>
    </div>
  </nav>

  <!-- 主内容 -->
  <main class="main-content">
    <!-- 状态栏 -->
    <div class="page-sub" id="dataStatus">正在加载数据...</div>

    <!-- 周报 -->
    <div id="tab-weekly" class="tab-content active">
      <h1 class="page-title">主播周报</h1>
      <div class="filter-bar">
        <select id="week-selector" class="sel" onchange="loadWeeklyReport()"></select>
        <select id="weekly-account-filter" class="sel" onchange="loadWeeklyReport()">
          <option value="">全部主播</option>
        </select>
      </div>
      <div id="weekly-content"></div>
    </div>

    <!-- 月报 -->
    <div id="tab-monthly" class="tab-content">
      <h1 class="page-title">主播月报</h1>
      <div class="filter-bar">
        <select id="month-selector" class="sel" onchange="loadMonthlyReport()"></select>
        <select id="monthly-account-filter" class="sel" onchange="loadMonthlyReport()">
          <option value="">全部主播</option>
        </select>
      </div>
      <div id="monthly-content"></div>
    </div>

    <!-- 直播日历 -->
    <div id="tab-calendar" class="tab-content">
      <h1 class="page-title">直播日历</h1>
      <div class="filter-bar">
        <select id="calendar-account-filter" class="sel" onchange="loadCalendar()">
          <option value="">全部主播</option>
        </select>
        <button class="btn btn-outline" onclick="prevMonth()">上一月</button>
        <span id="calendar-month-label" class="muted" style="font-size:14px;"></span>
        <button class="btn btn-outline" onclick="nextMonth()">下一月</button>
      </div>
      <div class="panel mb">
        <div class="calendar-header">
          <div class="calendar-day-header">周一</div>
          <div class="calendar-day-header">周二</div>
          <div class="calendar-day-header">周三</div>
          <div class="calendar-day-header">周四</div>
          <div class="calendar-day-header">周五</div>
          <div class="calendar-day-header">周六</div>
          <div class="calendar-day-header">周日</div>
        </div>
        <div id="calendar-grid" class="calendar-grid"></div>
      </div>
      <div id="calendar-detail" class="panel mb"></div>
      
      <!-- 手工添加直播记录 -->
      <div class="panel">
        <div class="panel-hd">
          <div class="panel-title">📝 手工添加直播记录</div>
          <span class="muted" style="font-size:12px;">点击日历日期自动填充</span>
        </div>
        <div class="g2">
          <div>
            <label class="lbl">主播账号</label>
            <select id="add-live-account" class="sel">
              <option value="">选择主播</option>
            </select>
          </div>
          <div>
            <label class="lbl">直播日期 <span class="muted">(点击日历选择)</span></label>
            <input type="date" id="add-live-date" class="inp" style="width:100%;background:var(--bg2);color:var(--text1);" readonly>
          </div>
        </div>
        <div class="g2">
          <div>
            <label class="lbl">开播时间</label>
            <input type="time" id="add-live-time" class="inp" style="width:100%;">
          </div>
          <div>
            <label class="lbl">直播时长(分钟)</label>
            <input type="number" id="add-live-duration" class="inp" style="width:100%;" placeholder="如: 60">
          </div>
        </div>
        <div style="margin-bottom:12px;">
          <label class="lbl">直播标题(可选)</label>
          <input type="text" id="add-live-title" class="inp" style="width:100%;" placeholder="直播标题">
        </div>
        <div style="margin-bottom:12px;">
          <label class="lbl">备注(可选)</label>
          <textarea id="add-live-notes" class="textarea" rows="2" placeholder="备注信息"></textarea>
        </div>
        <div style="display:flex;gap:12px;">
          <button class="btn btn-gold" onclick="addLiveRecord()">添加记录</button>
          <span id="add-live-result" class="muted"></span>
        </div>
      </div>
    </div>

    <!-- 直播明细 -->
    <div id="tab-live-details" class="tab-content">
      <h1 class="page-title">直播明细</h1>
      <p class="page-sub" id="live-details-sub">直播场次统计 · 涨粉汇总</p>
      
      <!-- 统计卡片 -->
      <div class="g4 mb">
        <div class="kpi" style="--accent:var(--gold)"><div class="kpi-lbl">直播场次</div><div class="kpi-val gold" id="live-detail-count">—</div></div>
        <div class="kpi" style="--accent:var(--green)"><div class="kpi-lbl">总涨粉</div><div class="kpi-val" id="live-detail-follow">—</div></div>
        <div class="kpi" style="--accent:var(--blue)"><div class="kpi-lbl">平均时长</div><div class="kpi-val" id="live-detail-duration">—</div><div class="kpi-delta muted">分钟</div></div>
        <div class="kpi" style="--accent:var(--purple)"><div class="kpi-lbl">平均峰值</div><div class="kpi-val" id="live-detail-pcu">—</div></div>
      </div>

      <!-- AI 分析区域（可折叠） -->
      <details class="prompt-detail mb" open>
        <summary style="font-size:15px;font-weight:500;padding:12px;background:var(--bg2);border-radius:var(--r);">
          🤖 AI 数据分析助手
          <button class="btn btn-outline" onclick="clearAIChatHistory();event.stopPropagation();" style="font-size:11px;margin-left:8px;">清空</button>
        </summary>
        <div style="padding:12px;">
          <!-- 对话历史区域 -->
          <div id="ai-analysis-result" style="min-height:100px;max-height:350px;overflow-y:auto;background:var(--bg2);border-radius:var(--r);padding:12px;">
            <div class="muted" style="text-align:center;padding:20px;">
              输入您的问题，AI 将基于当前筛选的直播数据进行分析<br>
              <span style="font-size:11px;">例如：分析涨粉趋势、对比主播表现、给出优化建议</span>
            </div>
          </div>
          <!-- 知识库选择 -->
          <div style="margin-top:12px;display:flex;gap:8px;align-items:center;">
            <select id="ai-knowledge-select" class="sel" style="width:200px;font-size:13px;" onchange="updateKnowledgeStatus()">
              <option value="">不使用知识库</option>
            </select>
            <span id="ai-knowledge-status" class="muted" style="font-size:11px;"></span>
          </div>
          <!-- 输入区域 -->
          <div style="margin-top:8px;display:flex;gap:8px;align-items:flex-end;">
            <textarea id="ai-input-prompt" 
              placeholder="输入问题...例如：哪个主播表现最好？" 
              style="flex:1;min-height:50px;max-height:120px;padding:10px;border-radius:var(--r);border:1px solid var(--border);background:var(--bg);color:var(--text);resize:vertical;font-size:13px;"
              onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault();sendAIPrompt();}"></textarea>
            <button class="btn" id="btn-ai-send" onclick="sendAIPrompt()" style="background:var(--gold);padding:10px 16px;">发送</button>
            <button class="btn btn-outline" id="btn-ai-batch" onclick="analyzeAllAnchors()" style="padding:10px 16px;">分析全部主播</button>
          </div>
        </div>
      </details>
      
      <!-- 篩选器 -->
      <div class="filter-bar">
        <select id="live-details-account" class="sel" onchange="loadLiveDetails()">
          <option value="">全部主播</option>
        </select>
        <div style="display:flex;gap:4px;">
          <button class="btn btn-outline" onclick="setLiveDetailsDateRange('day')" id="btn-live-day" style="padding:6px 12px;font-size:12px;">日</button>
          <button class="btn btn-outline" onclick="setLiveDetailsDateRange('week')" id="btn-live-week" style="padding:6px 12px;font-size:12px;">周</button>
          <button class="btn btn-outline" onclick="setLiveDetailsDateRange('month')" id="btn-live-month" style="padding:6px 12px;font-size:12px;">月</button>
          <button class="btn btn-outline" onclick="setLiveDetailsDateRange('year')" id="btn-live-year" style="padding:6px 12px;font-size:12px;">年</button>
          <button class="btn btn-outline" onclick="setLiveDetailsDateRange('all')" id="btn-live-all" style="padding:6px 12px;font-size:12px;">全部</button>
        </div>
        <input type="date" id="live-details-start" class="sel" onchange="loadLiveDetails()" style="width:120px;">
        <input type="date" id="live-details-end" class="sel" onchange="loadLiveDetails()" style="width:120px;">
      </div>
      
      <!-- 主播分组展示区域 -->
      <div id="live-details-content">加载中...</div>
    </div>

    <!-- 粉丝趋势 -->
    <div id="tab-fans-trend" class="tab-content">
      <h1 class="page-title">粉丝趋势分析</h1>

<script>
function $(id) { return document.getElementById(id); }
function esc(v) {
  if (!v) return "";
  return String(v).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#x27;");
}
const escapeHtml = esc;  // 别名
function fmt(n) { return Number(n || 0).toLocaleString("zh-CN"); }

// 主题切换
function setTheme(theme) {

  localStorage.setItem('theme', theme);

  $('theme-dark').classList.toggle('active', theme === 'dark');

  const s = String(t).replace('T', ' ');
  // 提取 "MM-DD HH:mm" 部分（索引 5-16，共11字符）
  return s.slice(5, 16);
};

// 带超时的 fetch 封装
async function fetchWithTimeout(url, options = {}, timeoutMs = 15000) {
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
  try {
    const res = await fetch(url, { ...options, signal: controller.signal });
    clearTimeout(timeoutId);
    return res;
  } catch (e) {
    clearTimeout(timeoutId);
    if (e.name === 'AbortError') {
      throw new Error('请求超时（15秒），请检查网络或服务状态');
    }
    throw e;
  }
}

// 加载主播列表
async function loadAccounts() {
  try {
    $('dataStatus').textContent = '正在连接服务器...';
    const res = await fetchWithTimeout('/api/operation/accounts', { credentials: 'include' }, 15000);
    
    // 处理 HTTP 错误
    if (!res.ok) {
      let errMsg = `HTTP ${res.status}`;
      try {
        const text = await res.text();
        const json = JSON.parse(text);
        errMsg = json.detail || json.error || errMsg;
      } catch {}
      
      // 未登录跳转
      if (res.status === 401) {
        $('dataStatus').innerHTML = '未登录或登录已失效，<a href="/index.html" style="color:var(--gold);">点击登录</a>';
        return;
      }
      
      // 权限不足
      if (res.status === 403) {
        $('dataStatus').textContent = '权限不足，无法访问运营数据中心';
        return;
      }
      
      throw new Error(errMsg);
    }
    
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || '获取主播列表失败');

    // 显示警告信息（如表不存在）
    if (data.warning) {
      $('dataStatus').innerHTML = `<span style="color:var(--gold);">${esc(data.warning)}</span>`;
      $('weekly-content').innerHTML = `<div class="panel"><div class="empty">${esc(data.warning)}</div></div>`;
      return;
    }

    const accounts = data.accounts || [];
    const options = accounts.map(a => `<option value="${esc(a.account)}">${esc(a.account)} (${a.live_count || 0}场)</option>`).join('');

    $('weekly-account-filter').innerHTML = '<option value="">全部主播</option>' + options;
    $('monthly-account-filter').innerHTML = '<option value="">全部主播</option>' + options;
    $('calendar-account-filter').innerHTML = '<option value="">全部主播</option>' + options;

    // 加载粉丝趋势主播列表（从客户会话表获取）

    const range = data.data_range || {};
    if (total > 0 && range.min && range.max) {
      $('dataStatus').textContent = `共 ${total} 条直播数据 · 时间范围: ${range.min.split(' ')[0]} ~ ${range.max.split(' ')[0]}`;
    } else {
      $('dataStatus').textContent = '暂无数据，请先导入';
    }
  } catch (e) {
    // 更详细的错误信息
    let errMsg = e.message || '未知错误';
    if (errMsg.includes('Failed to fetch') || errMsg.includes('NetworkError')) {
      errMsg = '网络连接失败，请检查服务器是否正常运行';
    }
    $('dataStatus').innerHTML = `<span style="color:var(--red);">加载失败: ${esc(errMsg)}</span> <a href="/index.html" style="color:var(--gold);margin-left:8px;">返回首页</a>`;

// 初始化周选择器
function initWeekSelector() {
  const today = new Date();
  const options = [];
  
  const getMonday = (d) => {
    const date = new Date(d);
    const day = date.getDay();
    const diff = date.getDate() - day + (day === 0 ? -6 : 1);
    date.setDate(diff);
    return date;
  };
  
  const fmtDate = (d) => `${d.getMonth() + 1}/${d.getDate()}`;
  const thisMonday = getMonday(today);
  
  for (let i = 0; i < 20; i++) {
    const monday = new Date(thisMonday);
    monday.setDate(monday.getDate() - i * 7);
    const sunday = new Date(monday);
    sunday.setDate(sunday.getDate() + 6);
    
    const label = i === 0 
      ? `${fmtDate(monday)} ~ ${fmtDate(sunday)} (本周)`
      : `${fmtDate(monday)} ~ ${fmtDate(sunday)}`;
    options.push(`<option value="${-i * 7}">${label}</option>`);
  }
  
  $('week-selector').innerHTML = options.join('');
}

// 初始化月选择器
function initMonthSelector() {
  const today = new Date();
  const options = [];
  for (let i = 0; i < 14; i++) {
    const d = new Date(today.getFullYear(), today.getMonth() - i, 1);
    const monthStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    options.push(`<option value="${monthStr}">${monthStr}</option>`);
  }
  $('month-selector').innerHTML = options.join('');
}

let chartInstances = {};
function renderAnchorChart(containerId, daily) {
  if (!daily.length || typeof echarts === 'undefined') return;

  // 销毁旧实例
  if (chartInstances[containerId]) {
    chartInstances[containerId].dispose();
  }

  const colors = getThemeColors();
  const dates = daily.map(d => d.day?.slice(5) || '');
  const acuData = daily.map(d => Math.round(d.avg_acu || 0));
  const fansDurData = daily.map(d => d.fans_avg_duration || 0);
  const nonFansDurData = daily.map(d => d.non_fans_avg_duration || 0);

  const chart = echarts.init(document.getElementById(containerId));
  chartInstances[containerId] = chart;

  const option = {
    backgroundColor: 'transparent',
    tooltip: {
      trigger: 'axis',
      axisPointer: { type: 'shadow' },
      backgroundColor: colors.bg,
      borderColor: colors.border,
      textStyle: { color: colors.text },
      formatter: function(params) {
        let result = params[0].axisValue + '<br/>';
        params.forEach(p => {
          if (p.seriesName === '在线人数') {
            result += `<span style="color:${colors.gold}">● 在线人数: ${p.value} 人</span><br/>`;
          } else if (p.seriesName === '粉丝停留') {
            result += `<span style="color:${colors.gold}">▌ 粉丝停留: ${p.value} 分钟</span><br/>`;
          } else if (p.seriesName === '非粉停留') {
            result += `<span style="color:${colors.blue}">▌ 非粉停留: ${p.value} 分钟</span><br/>`;
          }
        });
        return result;
      }
    },
    legend: {
      data: ['在线人数', '粉丝停留', '非粉停留'],
      top: 5,
      textStyle: { color: colors.textMuted, fontSize: 11 },
      itemWidth: 12,
      itemHeight: 12
    },
    grid: {
      left: '12%',
      right: '12%',
      top: '15%',
      bottom: '12%'
    },
    xAxis: {
      type: 'category',
      data: dates,

// 日历相关
function prevMonth() {
  calendarDate.setMonth(calendarDate.getMonth() - 1);
  loadCalendar();
}

function nextMonth() {
  calendarDate.setMonth(calendarDate.getMonth() + 1);
  loadCalendar();
}

async function loadCalendar() {
  const account = $('calendar-account-filter').value;
  const year = calendarDate.getFullYear();
  const month = calendarDate.getMonth();

  $('calendar-month-label').textContent = `${year}年${month + 1}月`;
  $('calendar-grid').innerHTML = '<div class="empty" style="grid-column:span 7;">正在加载日历数据...</div>';

  try {
    const params = new URLSearchParams();
    params.set('year', year);
    params.set('month', month + 1);
    if (account) params.set('account', account);

    const res = await fetchWithTimeout('/api/operation/calendar?' + params, { credentials: 'include' }, 15000);
    
    if (!res.ok) {
      let errMsg = `HTTP ${res.status}`;
      try {
        const text = await res.text();
        const json = JSON.parse(text);
        errMsg = json.detail || json.error || errMsg;
      } catch {}
      if (res.status === 401) {
        $('calendar-grid').innerHTML = '<div class="empty" style="grid-column:span 7;">未登录，<a href="/index.html" style="color:var(--gold);">点击登录</a></div>';
        return;
      }
      throw new Error(errMsg);
    }
    
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || '获取日历失败');

    renderCalendar(data, year, month);
  } catch (e) {
    let errMsg = e.message || '未知错误';
    if (errMsg.includes('Failed to fetch') || errMsg.includes('NetworkError')) {
      errMsg = '网络连接失败';
    }
    $('calendar-grid').innerHTML = `<div class="empty" style="grid-column:span 7;color:var(--red);">${esc(errMsg)}</div>`;
  }
}

function renderCalendar(data, year, month) {
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const firstDay = new Date(year, month, 1).getDay();
  const startOffset = firstDay === 0 ? 6 : firstDay - 1; // 周一为第一天

  const liveData = data.days || {};
  const today = new Date();

  let html = '';

  // 上月填充
  const prevMonthDays = new Date(year, month, 0).getDate();
  for (let i = startOffset - 1; i >= 0; i--) {
    const day = prevMonthDays - i;
    html += `<div class="calendar-day other-month"><div class="calendar-date">${day}</div></div>`;
  }

  // 当月
  for (let day = 1; day <= daysInMonth; day++) {
    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    const dayData = liveData[dateStr] || {};
    const isToday = today.getFullYear() === year && today.getMonth() === month && today.getDate() === day;
    const hasLive = dayData.count > 0;

    const classes = ['calendar-day'];
    if (isToday) classes.push('today');
    if (hasLive) classes.push('has-live');

    // 收集主播名字和开播时间
    let anchorInfo = '';
    if (hasLive && dayData.lives) {
      // 按开播时间排序
      const sortedLives = dayData.lives.sort((a, b) => {
        const timeA = a.start_time || '';
        const timeB = b.start_time || '';
        return timeA.localeCompare(timeB);
      });
      
      // 显示前3场直播的信息
      const displayLives = sortedLives.slice(0, 3);
      anchorInfo = displayLives.map(l => {
        const time = l.start_time ? l.start_time.split(' ')[1]?.slice(0, 5) || '' : '';
        const timeStr = time ? ` ${time}` : '';
        return `<div class="calendar-anchor">${esc(l.account)}${timeStr}</div>`;
      }).join('');
      
      if (sortedLives.length > 3) {
        anchorInfo += `<div class="calendar-anchor muted">+${sortedLives.length - 3}场</div>`;
      }
    }

    html += `
      <div class="${classes.join(' ')}" onclick="showDayDetail(event, '${dateStr}', ${JSON.stringify(dayData).replace(/"/g, '&quot;')})">
        <div class="calendar-date">${day}</div>
        ${anchorInfo}
        ${hasLive ? `<div class="calendar-live-count">${dayData.count}场</div>` : ''}
      </div>
    `;
  }

  // 下月填充
  const totalCells = startOffset + daysInMonth;
  const remaining = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
  for (let i = 1; i <= remaining; i++) {
    html += `<div class="calendar-day other-month"><div class="calendar-date">${i}</div></div>`;
  }

  $('calendar-grid').innerHTML = html;
  $('calendar-detail').innerHTML = '<div class="muted">点击日期查看直播详情</div>';
}

function showDayDetail(event, dateStr, dayData) {
  // 移除之前的选中状态
  document.querySelectorAll('.calendar-day.selected').forEach(el => el.classList.remove('selected'));
  // 给当前点击的日期添加选中状态
  if (event && event.currentTarget) {
    event.currentTarget.classList.add('selected');
  }
  
  // 自动填充手工添加表单的日期字段
  $('add-live-date').value = dateStr;

  if (!dayData || !dayData.lives || !dayData.lives.length) {
    $('calendar-detail').innerHTML = `<div class="muted">${dateStr} 无直播记录</div>`;
    return;
  }
  
  let html = `
    <div class="panel-hd">
      <div class="panel-title">${dateStr} 直播明细</div>
      <span class="badge gold">${dayData.count} 场</span>
    </div>
    <table class="tbl">
      <tr><th>主播</th><th>开播时间</th><th>时长</th><th>观看</th><th>涨粉</th><th>来源</th></tr>
      ${dayData.lives.map(l => `
        <tr>
          <td>${esc(l.account)}</td>
          <td class="mono">${(l.start_time || '').split(' ')[1]?.slice(0, 5) || '-'}</td>
          <td class="mono">${l.duration || 0}分</td>
          <td class="mono">${fmt(l.watch_ucnt)}</td>
          <td class="green mono">${fmt(l.follow_ucnt)}</td>
          <td>${l.notes && l.notes.includes("[手工录入]") ? "<button onclick=deleteLiveRecord('" + l.room_id + "') style=font-size:10px;padding:2px 6px;background:var(--red);border:none;color:#fff;border-radius:4px;cursor:pointer;>删除</button>" : "<span class=muted style=font-size:10px;>CSV导入</span>"}</td>
        </tr>
      `).join('')}
    </table>
  `;
  
  $('calendar-detail').innerHTML = html;
}

// 删除直播记录
async function deleteLiveRecord(roomId) {
  if (!confirm('确定删除该直播记录？')) return;

  try {
    const res = await fetch('/api/operation/live/' + roomId, {
      method: 'DELETE',
      credentials: 'include'
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || '删除失败');

    // 刷新日历
    loadCalendar();
    $('calendar-detail').innerHTML = '<div style="color:var(--green);padding:8px;">已删除</div>';
  } catch (e) {
    alert('删除失败: ' + e.message);
  }
}

// 热力图颜色计算 (复刻top200的紫色系)
function heatColor(value) {
  if (value <= 0) return '';
  const alpha = Math.max(0.05, Math.min(0.82, value / 100 * 0.82));
  const textColor = value >= 45 ? 'var(--text0)' : 'var(--text1)';
  return `background: rgba(99,102,241,${alpha}); color: ${textColor}`;
}

// 日期范围设置函数
function setLiveDetailsDateRange(range) {
  const today = new Date();
  let startDate, endDate;
  
  endDate = today.toISOString().slice(0, 10);
  
  switch(range) {
    case 'day':
      startDate = endDate;
      break;
    case 'week':
      const weekStart = new Date(today);
      weekStart.setDate(today.getDate() - 7);
      startDate = weekStart.toISOString().slice(0, 10);
      break;
    case 'month':
      startDate = today.toISOString().slice(0, 8) + '01';
      break;
    case 'year':
      startDate = today.toISOString().slice(0, 5) + '01-01';
      break;
    case 'all':
      startDate = '';
      endDate = '';
      break;
  }
  
  $('live-details-start').value = startDate;
  $('live-details-end').value = endDate;
  
  // 更新按钮状态
  ['day', 'week', 'month', 'year', 'all'].forEach(r => {
    const btn = $('btn-live-' + r);
    if (btn) {
      if (r === range) {
        btn.style.background = 'var(--gold)';
        btn.style.color = '#fff';
        btn.style.borderColor = 'var(--gold)';
      } else {
        btn.style.background = '';
        btn.style.color = '';
        btn.style.borderColor = '';
      }
    }
  });
  
  loadLiveDetails();
}

    select.innerHTML = '<option value="">不使用知识库</option>';

      aiKnowledgeList = data;

      for (const kb of data) {
        if (kb.file_type === 'distill' || kb.id?.startsWith('distill:')) {
          const name = kb.id.replace('distill:', '');
          const transcriptCount = kb.transcript_count || 0;
          const hasProfile = kb.has_profile || false;
          let desc = '';
          if (hasProfile && transcriptCount > 0) {
            desc = `（资料+${transcriptCount}份逐字稿）`;
          } else if (transcriptCount > 0) {
            desc = `（${transcriptCount}份逐字稿）`;
          } else if (hasProfile) {
            desc = '（主播资料）';
          }
          select.innerHTML += `<option value="${kb.id}">📚 ${name}${desc}</option>`;
        } else if (kb.id?.startsWith('anchor:')) {
          const name = kb.id.replace('anchor:', '');
          select.innerHTML += `<option value="${kb.id}">👤 ${name}（主播资料）</option>`;
        } else if (kb.id?.startsWith('transcript:')) {
          const name = kb.id.replace('transcript:', '');
          select.innerHTML += `<option value="${kb.id}">📝 ${name}（逐字稿）</option>`;
        } else if (kb.file_type !== 'distill') {
          // 普通知识库
          select.innerHTML += `<option value="${kb.id}">📁 ${kb.name}</option>`;
        }
      }
    }
  } catch (e) {
    console.log('加载知识库失败:', e);

      // 构建数据上下文
      const byAccount = {};
      for (const row of data.details) {
        const acc = row.account || '未知';
        if (!byAccount[acc]) {
          byAccount[acc] = { liveCount: 0, totalWatch: 0, totalFollow: 0, totalEarn: 0, totalDuration: 0, totalPcu: 0, totalShow: 0, lives: [] };
        }
        byAccount[acc].liveCount++;
        byAccount[acc].totalWatch += row.watch_ucnt || 0;
        byAccount[acc].totalFollow += row.follow_ucnt || 0;
        byAccount[acc].totalEarn += row.earn_score || 0;
        byAccount[acc].totalDuration += row.duration || 0;
        byAccount[acc].totalPcu += row.pcu || 0;
        byAccount[acc].totalShow += row.show_ucnt || 0;
        byAccount[acc].lives.push(row);
      }

      aiDataContext = `【直播数据】筛选条件：主播=${account || '全部'}，日期=${startDate || '不限'} 至 ${endDate || '不限'}，共${data.details.length}场直播

`;
      
      for (const [accName, accData] of Object.entries(byAccount)) {
        aiDataContext += `主播【${accName}】：${accData.liveCount}场直播，观看${fmt(accData.totalWatch)}，涨粉${fmt(accData.totalFollow)}，时长${accData.totalDuration}分，音浪${fmt(accData.totalEarn)}，平均峰值${Math.round(accData.totalPcu/accData.liveCount)}
`;
        aiDataContext += `最近场次：${accData.lives.slice(-10).map(l => `${l.start_time?.slice(0,10)}|涨粉${l.follow_ucnt}|观看${l.watch_ucnt}|峰值${l.pcu}`).join('; ')}

`;
      }
    }
    
    // 构建系统提示词
    const systemPrompt = `你是一位专业的直播数据分析专家。以下是用户的直播数据摘要，请基于这些数据回答用户的问题。
${aiDataContext}
回答要求：
1. 基于数据事实进行分析，不要编造数据
2. 给出具体数字和对比
3. 提供专业的优化建议
4. 用清晰简洁的中文回答`;

    // 获取知识库ID
    const kbId = $('ai-knowledge-select')?.value || '';
    
    // 调用 AI（使用 ai-chat API 支持知识库）
    const aiResp = await fetch('/api/ai-chat/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({
        sessionId: '',  // 新对话
        message: userPrompt,
        systemPrompt: systemPrompt,
        knowledgeBaseId: kbId,  // 传入知识库ID，支持逐字稿
        model: ''
      })
    });
    
    const aiResult = await aiResp.json();
    // ai-chat API 返回 message 字段，generate API 返回 markdown 字段
    const markdown = aiResult.message || aiResult.markdown || aiResult.output_text || '分析完成';
    
    // 记录对话历史
    aiChatHistory.push({ role: 'user', content: userPrompt });
    aiChatHistory.push({ role: 'assistant', content: markdown });
    
    // 显示 AI 回复
    $('ai-loading').innerHTML = `<div style="font-size:12px;color:var(--gold);margin-bottom:4px;">🤖 AI</div>
      <div style="line-height:1.6;">${renderSimpleMarkdown(markdown)}</div>`;
    
    // 滚动到底部
    resultEl.scrollTop = resultEl.scrollHeight;
    
    inputEl.value = '';
    
  } catch (e) {
    $('ai-loading').innerHTML = `<div style="color:var(--red);">分析失败: ${escapeHtml(e.message || e)}</div>`;
  }
  
  btn.disabled = false;
  btn.textContent = '发送';
}


// 批量分析所有主播
async function analyzeAllAnchors() {
  const btn = $('btn-ai-batch');
  const resultEl = $('ai-analysis-result');
  
  btn.disabled = true;
  btn.textContent = '分析中...';
  
  resultEl.innerHTML = '<div style="text-align:center;padding:20px;color:var(--textMuted);">正在为每个主播生成分析建议...</div>';
  
  try {
    // 获取所有主播数据
    const anchors = [];
    for (const key of Object.keys(liveDetailsChartInstances)) {
      if (key.startsWith('anchor-')) {
        anchors.push({
          index: key.replace('anchor-', ''),
          name: liveDetailsChartInstances[key].name,
          data: liveDetailsChartInstances[key].data
        });
      }
    }
    
    if (anchors.length === 0) {
      resultEl.innerHTML = '<div style="color:var(--red);text-align:center;padding:20px;">请先加载直播数据</div>';
      btn.disabled = false;
      btn.textContent = '分析全部主播';
      return;
    }
    
    resultEl.innerHTML = '';
    
    // 逐个分析主播
    for (let i = 0; i < anchors.length; i++) {
      const anchor = anchors[i];
      resultEl.innerHTML += `<div style="margin-bottom:8px;font-size:12px;color:var(--textMuted);">正在分析 ${anchor.name} (${i+1}/${anchors.length})...</div>`;
      resultEl.scrollTop = resultEl.scrollHeight;
      
      // 构建分析提示词
      const avgFollow = anchor.data.liveCount > 0 ? Math.round(anchor.data.totalFollow / anchor.data.liveCount) : 0;
      const avgWatch = anchor.data.liveCount > 0 ? Math.round(anchor.data.totalWatch / anchor.data.liveCount) : 0;
      const avgPcu = anchor.data.liveCount > 0 ? Math.round(anchor.data.totalPcu / anchor.data.liveCount) : 0;
      const avgDuration = anchor.data.liveCount > 0 ? Math.round(anchor.data.totalDuration / anchor.data.liveCount) : 0;
      const followRate = anchor.data.totalWatch > 0 ? (anchor.data.totalFollow / anchor.data.totalWatch * 100).toFixed(2) : 0;
      
      

      const systemPrompt = `你是一位专业的直播数据分析专家。请根据主播的直播数据，进行深入分析。

请按以下格式回复（JSON格式）：
{
  "summary": "一句话总结评价（20-30字）",
  "points": ["核心要点1（具体数据支撑）", "核心要点2", "核心要点3"],
  "issues": ["存在的问题1（具体说明）", "存在的问题2"],
  "suggestions": ["优化建议1（可执行）", "优化建议2", "优化建议3"]
}

分析要点：
1. 结合具体数据分析涨粉、观看、停留时长等指标
2. 对比行业平均水平给出评价
3. 提出切实可行的优化建议
4. 总结要突出主播的核心特点`;

      // 构建数据详情
      const recentLives = anchor.data.lives.slice(-10).map(l => 
        `${l.start_time?.slice(0,10)}: 涨粉${l.follow_ucnt}|观看${l.watch_ucnt}|峰值${l.pcu}|时长${l.duration}分`
      ).join('\n');

      // 计算平均停留时长
      const avgStay = anchor.data.lives.reduce((sum, l) => sum + (l.avg_watch_duration || 0), 0) / anchor.data.liveCount || 0;
      const avgFansStay = anchor.data.lives.reduce((sum, l) => sum + (l.fans_avg_watch_duration || 0), 0) / anchor.data.liveCount || 0;
      const avgNonFansStay = anchor.data.lives.reduce((sum, l) => sum + (l.non_fans_avg_watch_duration || 0), 0) / anchor.data.liveCount || 0;
      
      const anchorDataText = `主播【${anchor.name}】直播数据分析：

【基础数据】
- 直播场次：${anchor.data.liveCount}场
- 总涨粉：${anchor.data.totalFollow}人，场均涨粉${avgFollow}人
- 总观看：${anchor.data.totalWatch}人，场均观看${avgWatch}人
- 涨粉率：${followRate}%（观看转关注比例）
- 平均峰值：${avgPcu}人
- 平均时长：${avgDuration}分钟
- 人均停留：${avgStay.toFixed(1)}分钟（粉丝${avgFansStay.toFixed(1)}分/非粉${avgNonFansStay.toFixed(1)}分）
- 音浪收入：${anchor.data.totalEarn}

【近10场直播明细】
${recentLives}`;

      try {
        const aiResp = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({
            systemPrompt: systemPrompt,
            userPrompt: anchorDataText,
            model: ''
          })
        });
        
        const aiResult = await aiResp.json();
        let markdown = aiResult.markdown || aiResult.output_text || '';
        
        // 尝试解析 JSON 结果
        let analysis = null;
        try {
          // 提取 JSON 部分
          const jsonMatch = markdown.match(/\{[\s\S]*\}/);
          if (jsonMatch) {
            analysis = JSON.parse(jsonMatch[0]);
          }
        } catch (e) {
          // JSON 解析失败，使用原始文本
        }
        
        // 填充一句话总结
        const summaryEl = $('anchor-summary-' + anchor.index);
        if (summaryEl) {
          if (analysis && analysis.summary) {
            summaryEl.innerHTML = '💡 ' + analysis.summary;
          } else {
            summaryEl.innerHTML = '💡 ' + (markdown.slice(0, 100) || '分析完成');
          }
        }
        
        // 填充详细分析报告
        const anchorAiEl = $('anchor-ai-' + anchor.index);
        if (anchorAiEl) {
          anchorAiEl.style.display = 'block';
          
          if (analysis) {
            // 使用解析后的结构化数据
            anchorAiEl.querySelector('.anchor-ai-points div:last-child').innerHTML = 
              analysis.points?.map(p => '• ' + p).join('<br>') || '-';
            anchorAiEl.querySelector('.anchor-ai-issues div:last-child').innerHTML = 
              analysis.issues?.map(p => '• ' + p).join('<br>') || '-';
            anchorAiEl.querySelector('.anchor-ai-suggestions div:last-child').innerHTML = 
              analysis.suggestions?.map(p => '• ' + p).join('<br>') || '-';
          } else {
            // 使用原始文本，尝试分段
            const lines = markdown.split('\n').filter(l => l.trim());
            let points = [], issues = [], suggestions = [];
            
            for (const line of lines) {
              if (line.includes('优点') || line.includes('要点') || line.includes('表现') || line.includes('良好')) {
                points.push(line);
              } else if (line.includes('问题') || line.includes('不足') || line.includes('待改进') || line.includes('需提升')) {
                issues.push(line);
              } else if (line.includes('建议') || line.includes('优化') || line.includes('调整')) {
                suggestions.push(line);
              }
            }
            
            anchorAiEl.querySelector('.anchor-ai-points div:last-child').innerHTML = 
              points.map(p => '• ' + p).join('<br>') || markdown.slice(0, 200);
            anchorAiEl.querySelector('.anchor-ai-issues div:last-child').innerHTML = 
              issues.map(p => '• ' + p).join('<br>') || '无明显问题';
            anchorAiEl.querySelector('.anchor-ai-suggestions div:last-child').innerHTML = 
              suggestions.map(p => '• ' + p).join('<br>') || '继续保持现有策略';
          }
        }
        
        resultEl.innerHTML += `<div style="margin-bottom:8px;font-size:12px;color:var(--green);">✓ ${anchor.name} 分析完成</div>`;
        
      } catch (e) {
        resultEl.innerHTML += `<div style="margin-bottom:8px;font-size:12px;color:var(--red);">✗ ${anchor.name} 分析失败: ${escapeHtml(e.message || e)}</div>`;
      }
      
      // 小延迟避免请求过快
      if (i < anchors.length - 1) {
        await new Promise(r => setTimeout(r, 300));
      }
    }
    
    resultEl.innerHTML += `<div style="margin-top:12px;padding:12px;background:var(--bg);border-radius:var(--r);text-align:center;color:var(--green);">全部主播分析完成！结果已显示在各主播卡片下方</div>`;
    
  } catch (e) {
    resultEl.innerHTML = `<div style="color:var(--red);text-align:center;padding:20px;">分析失败: ${escapeHtml(e.message || e)}</div>`;
  }
  
  btn.disabled = false;
  btn.textContent = '分析全部主播';
}

// 简单的 Markdown 渲染
function renderSimpleMarkdown(md) {
  if (!md) return '';
  
  // 代码块
  md = md.replace(/```([\s\S]*?)```/g, '<pre style="background:var(--bg2);padding:12px;border-radius:var(--r);overflow-x:auto;font-size:13px;"><code>$1</code></pre>');
  
  // 行内代码
  md = md.replace(/`([^`]+)`/g, '<code style="background:var(--bg2);padding:2px 6px;border-radius:3px;font-size:13px;">$1</code>');
  
  // 标题
  md = md.replace(/^### (.+)$/gm, '<h4 style="margin:16px 0 8px;font-weight:500;">$1</h4>');
  md = md.replace(/^## (.+)$/gm, '<h3 style="margin:20px 0 12px;font-weight:600;">$1</h3>');
  md = md.replace(/^# (.+)$/gm, '<h2 style="margin:24px 0 16px;font-weight:600;font-size:18px;">$1</h2>');
  
  // 列表
  md = md.replace(/^\* (.+)$/gm, '<li style="margin:4px 0;">$1</li>');
  md = md.replace(/^- (.+)$/gm, '<li style="margin:4px 0;">$1</li>');
  md = md.replace(/^(\d+)\. (.+)$/gm, '<li style="margin:4px 0;">$2</li>');
  
  // 粗体和斜体
  md = md.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  md = md.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  
  // 段落
  md = md.replace(/\n\n/g, '</p><p style="margin:12px 0;">');
  
  return '<p style="margin:12px 0;">' + md + '</p>';
}
