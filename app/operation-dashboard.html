<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抖音运营综合数据看板</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --sidebar-width: 260px;
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --bg-dark: #0f172a;
            --sidebar-bg: #1e293b;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --active-bg: rgba(99, 102, 241, 0.15);
            --card-bg: #1e293b;
            --border: rgba(255, 255, 255, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        .sidebar {
            width: var(--sidebar-width);
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 24px;
            flex-shrink: 0;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 40px;
            background: linear-gradient(45deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-menu {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-item {
            padding: 14px 18px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-dim);
            font-weight: 500;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
        }

        .nav-item.active {
            background: var(--active-bg);
            color: var(--primary-color);
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        .nav-item .icon { font-size: 1.2rem; }

        .main-content {
            flex-grow: 1;
            height: 100vh;
            overflow-y: auto;
            padding: 30px;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(45deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header .subtitle {
            color: var(--text-dim);
            margin-top: 8px;
        }

        .filter-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .filter-bar select,
        .filter-bar input {
            padding: 10px 16px;
            border-radius: 8px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }

        .filter-bar select:focus,
        .filter-bar input:focus {
            border-color: var(--primary-color);
        }

        .card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            border: 1px solid var(--border);
            margin-bottom: 24px;
        }

        .card h2 {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card h2::before {
            content: '';
            width: 4px;
            height: 20px;
            background: var(--primary-color);
            border-radius: 2px;
        }

        .card h3 {
            color: #f59e0b;
            margin-top: 20px;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: rgba(30, 41, 59, 0.8);
            padding: 20px;
            border-radius: 12px;
            border-top: 2px solid var(--primary-color);
        }

        .stat-card .label {
            color: var(--text-dim);
            font-size: 13px;
            margin-bottom: 8px;
        }

        .stat-card .value {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary-color);
        }

        .stat-card .value.green { color: #10b981; }
        .stat-card .value.red { color: #ef4444; }
        .stat-card .value.yellow { color: #f59e0b; }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th, td {
            padding: 12px 10px;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }

        th {
            background: rgba(99, 102, 241, 0.1);
            color: var(--text-dim);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 11px;
        }

        td { color: var(--text-main); }

        tr:hover td { background: rgba(99, 102, 241, 0.05); }

        .video-title {
            text-align: left;
            max-width: 250px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .table-wrap {
            overflow-x: auto;
            margin-top: 12px;
        }

        .empty { color: var(--text-dim); text-align: center; padding: 40px; }

        .status-bar {
            margin-top: auto;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            font-size: 0.8rem;
            color: var(--text-dim);
        }

        /* 导入管理样式 */
        .import-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
            margin-bottom: 10px;
        }

        .import-btn:hover { background: var(--primary-hover); }

        .file-input {
            width: 100%;
            padding: 12px;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            margin-bottom: 12px;
        }

        .import-log-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .import-log-item {
            padding: 12px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .import-log-item .type { color: var(--primary-color); font-weight: 600; }
        .import-log-item .status.success { color: #10b981; }
        .import-log-item .status.failed { color: #ef4444; }

        .result-msg { margin-top: 12px; font-size: 13px; }
        .result-msg.success { color: #10b981; }
        .result-msg.error { color: #ef4444; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">
            <span>📊</span>
            <span>运营数据中心</span>
        </div>

        <div class="nav-menu">
            <div class="nav-item active" onclick="switchTab('weekly', this)">
                <span class="icon">📅</span>
                <span>主播周报</span>
            </div>
            <div class="nav-item" onclick="switchTab('monthly', this)">
                <span class="icon">📈</span>
                <span>主播月报</span>
            </div>
            <div class="nav-item" onclick="switchTab('top200', this)">
                <span class="icon">🏆</span>
                <span>TOP200分析</span>
            </div>
        </div>

        <div class="status-bar">
            <div id="lastSync">加载中...</div>
        </div>
    </div>

    <div class="main-content">
        <!-- 主播周报 -->
        <div id="tab-weekly" class="tab-content active">
            <div class="header">
                <h1>主播周报</h1>
                <div class="subtitle">直播时间表 · 短视频数据 · 直播数据汇总</div>
            </div>
            <div class="filter-bar">
                <select id="week-selector" onchange="loadWeeklyReport()">
                    <option value="0">本周</option>
                    <option value="-7">上周</option>
                    <option value="-14">两周前</option>
                    <option value="-21">三周前</option>
                    <option value="-28">四周前</option>
                    <option value="-35">五周前</option>
                    <option value="-42">六周前</option>
                    <option value="-49">七周前</option>
                    <option value="-56">八周前</option>
                    <option value="-63">九周前</option>
                    <option value="-70">十周前</option>
                    <option value="-77">十一周前</option>
                    <option value="-84">十二周前</option>
                    <option value="-91">十三周前</option>
                    <option value="-98">十四周前</option>
                    <option value="-105">十五周前</option>
                    <option value="-112">十六周前</option>
                    <option value="-119">十七周前</option>
                    <option value="-126">十八周前</option>
                    <option value="-133">十九周前</option>
                    <option value="-140">二十周前</option>
                </select>
                <select id="weekly-account-filter" onchange="loadWeeklyReport()">
                    <option value="">全部主播</option>
                </select>
            </div>
            <div id="weekly-content"></div>
        </div>

        <!-- 主播月报 -->
        <div id="tab-monthly" class="tab-content">
            <div class="header">
                <h1>主播月报</h1>
                <div class="subtitle">历史分月统计 · 数据明细</div>
            </div>
            <div class="filter-bar">
                <select id="month-selector" onchange="loadMonthlyReport()">
                </select>
                <select id="monthly-account-filter" onchange="loadMonthlyReport()">
                    <option value="">全部主播</option>
                </select>
            </div>
            <div id="monthly-content"></div>
        </div>

        <!-- TOP200分析 -->
        <div id="tab-top200" class="tab-content">
            <div class="header">
                <h1>TOP200 粉丝趋势看板</h1>
                <div class="subtitle">核心粉丝 · 同期群留存 · 月度流转</div>
            </div>
            <div id="top200-content">
                <div class="card">
                    <div class="empty">TOP200数据需要客户库数据支持。<br><br>请前往 <a href="/customer-trends.html" style="color:var(--primary-color)">客户趋势看板</a> 查看粉丝留存分析。</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const $ = id => document.getElementById(id);
        const esc = v => String(v ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
        const fmt = n => Number(n || 0).toLocaleString('zh-CN');

        function switchTab(tabId, el) {
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            el.classList.add('active');
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            $('tab-' + tabId).classList.add('active');

            if (tabId === 'weekly') loadWeeklyReport();
            if (tabId === 'monthly') loadMonthlyReport();
        }

        // 加载主播列表
        async function loadAccounts() {
            try {
                const res = await fetch('/api/operation/accounts', { credentials: 'include' });
                const data = await res.json();
                if (!data.ok) throw new Error(data.error || '获取主播列表失败');

                const accounts = data.accounts || [];
                const options = accounts.map(a => `<option value="${esc(a.account)}">${esc(a.account)} (${a.live_count || 0}场)</option>`).join('');

                $('weekly-account-filter').innerHTML = '<option value="">全部主播</option>' + options;
                $('monthly-account-filter').innerHTML = '<option value="">全部主播</option>' + options;

                // 显示数据统计
                const total = data.total_count || 0;
                const range = data.data_range || {};
                if (total > 0 && range.min && range.max) {
                    $('lastSync').textContent = `共 ${total} 条数据 | 时间范围: ${range.min.split(' ')[0]} ~ ${range.max.split(' ')[0]}`;
                } else if (accounts.length > 0) {
                    const lastLive = accounts[0].last_live_time || '';
                    $('lastSync').textContent = '最近直播: ' + (lastLive ? lastLive.split(' ')[0] : '未知');
                } else {
                    $('lastSync').textContent = '暂无数据，请先导入';
                }
            } catch (e) {
                console.error(e);
                $('lastSync').textContent = '加载失败';
            }
        }

        // 加载周报
        async function loadWeeklyReport() {
            const weekOffset = $('week-selector').value || '0';
            const account = $('weekly-account-filter').value;

            // 计算周起始日期
            const today = new Date();
            const weekStart = new Date(today);
            weekStart.setDate(today.getDate() - today.getDay() + 1 + parseInt(weekOffset));
            const weekStartStr = weekStart.toISOString().split('T')[0];

            try {
                const params = new URLSearchParams();
                if (account) params.set('account', account);
                params.set('weekStart', weekStartStr);

                const res = await fetch('/api/operation/weekly-report?' + params, { credentials: 'include' });
                const data = await res.json();
                if (!data.ok) throw new Error(data.error || '获取周报失败');

                renderWeeklyReport(data);
            } catch (e) {
                $('weekly-content').innerHTML = `<div class="card"><div class="empty">${esc(e.message)}</div></div>`;
            }
        }

        function renderWeeklyReport(data) {
            const accounts = data.accounts || [];
            if (!accounts.length) {
                $('weekly-content').innerHTML = `<div class="card"><div class="empty">本周暂无数据，请先导入。</div></div>`;
                return;
            }

            const totalLiveCount = accounts.reduce((s, a) => s + (a.stats?.liveCount || 0), 0);
            const totalFollow = accounts.reduce((s, a) => s + (a.stats?.totalFollow || 0), 0);
            const totalVideoCount = accounts.reduce((s, a) => s + (a.video?.length || 0), 0);

            let html = `
                <div class="card">
                    <h2>本周数据概览 (${data.weekStart} ~ ${data.weekEnd})</h2>
                    <div class="stats-grid">
                        <div class="stat-card"><div class="label">主播数量</div><div class="value">${accounts.length}</div></div>
                        <div class="stat-card"><div class="label">直播场次</div><div class="value">${totalLiveCount}</div></div>
                        <div class="stat-card"><div class="label">涨粉总数</div><div class="value green">${fmt(totalFollow)}</div></div>
                        <div class="stat-card"><div class="label">短视频发布</div><div class="value">${totalVideoCount}</div></div>
                    </div>
                </div>
            `;

            for (const acc of accounts) {
                html += `<div class="card"><h2>👤 ${esc(acc.account)}</h2>`;

                // 短视频数据
                if (acc.video && acc.video.length) {
                    const totalPlay = acc.video.reduce((s, v) => s + (v.play_count || 0), 0);
                    const totalVideoFollow = acc.video.reduce((s, v) => s + (v.follow_count || 0), 0);
                    html += `
                        <h3>📊 短视频数据 (发布 ${acc.video.length} 条 | 播放 ${fmt(totalPlay)} | 涨粉 ${fmt(totalVideoFollow)})</h3>
                        <div class="table-wrap"><table>
                            <tr><th>发布时间</th><th>体裁</th><th>作品名称</th><th>播放量</th><th>点赞数</th><th>完播率</th><th>涨粉</th></tr>
                            ${acc.video.map(v => `
                                <tr>
                                    <td>${(v.publish_time || '').split(' ')[0].slice(5) || '-'}</td>
                                    <td>${esc(v.duration_type) || '-'}</td>
                                    <td class="video-title">${esc(v.title) || '-'}</td>
                                    <td>${fmt(v.play_count)}</td>
                                    <td>${fmt(v.like_count)}</td>
                                    <td>${Number(v.completion_rate || 0).toFixed(1)}%</td>
                                    <td>${fmt(v.follow_count)}</td>
                                </tr>
                            `).join('')}
                        </table></div>
                    `;
                }

                // 直播数据
                if (acc.live && acc.live.length) {
                    const totalLiveFollow = acc.live.reduce((s, l) => s + (l.follow_ucnt || 0), 0);
                    html += `
                        <h3>🎙️ 直播数据 (直播 ${acc.live.length} 场 | 涨粉 ${fmt(totalLiveFollow)})</h3>
                        <div class="table-wrap"><table>
                            <tr><th>开播时间</th><th>时长(分)</th><th>峰值/平均</th><th>曝光/观看</th><th>粉丝/非粉</th><th>停留(分)</th><th>涨粉</th><th>涨粉率</th></tr>
                            ${acc.live.map(l => `
                                <tr>
                                    <td>${(l.start_time || '').slice(5, 16) || '-'}</td>
                                    <td>${l.duration || 0}</td>
                                    <td>${fmt(l.pcu)}/${fmt(l.acu)}</td>
                                    <td>${fmt(l.show_ucnt)}/${fmt(l.watch_ucnt)}</td>
                                    <td>${fmt(l.fans_watch_ucnt)}/${fmt(l.non_fans_watch_ucnt)}</td>
                                    <td>${Number(l.avg_watch_duration || 0).toFixed(1)}</td>
                                    <td>${fmt(l.follow_ucnt)}</td>
                                    <td>${Number(l.follow_u_rate || 0).toFixed(2)}%</td>
                                </tr>
                            `).join('')}
                        </table></div>
                    `;
                }

                html += `</div>`;
            }

            $('weekly-content').innerHTML = html;
        }

        // 加载月报
        async function loadMonthlyReport() {
            const month = $('month-selector').value;
            const account = $('monthly-account-filter').value;

            try {
                const params = new URLSearchParams();
                if (account) params.set('account', account);
                if (month) params.set('month', month);

                const res = await fetch('/api/operation/monthly-report?' + params, { credentials: 'include' });
                const data = await res.json();
                if (!data.ok) throw new Error(data.error || '获取月报失败');

                renderMonthlyReport(data);
            } catch (e) {
                $('monthly-content').innerHTML = `<div class="card"><div class="empty">${esc(e.message)}</div></div>`;
            }
        }

        function renderMonthlyReport(data) {
            const live = data.live || [];
            const video = data.video || [];
            const history = data.history || [];

            if (!live.length && !video.length) {
                $('monthly-content').innerHTML = `<div class="card"><div class="empty">${data.month} 暂无数据</div></div>`;
                return;
            }

            const totalLiveFollow = live.reduce((s, l) => s + (l.follow_ucnt || 0), 0);
            const totalVideoFollow = video.reduce((s, v) => s + (v.follow_count || 0), 0);

            let html = `
                <div class="card">
                    <h2>${data.month} 月数据概览</h2>
                    <div class="stats-grid">
                        <div class="stat-card"><div class="label">直播场次</div><div class="value">${live.length}</div></div>
                        <div class="stat-card"><div class="label">短视频发布</div><div class="value">${video.length}</div></div>
                        <div class="stat-card"><div class="label">涨粉总数</div><div class="value green">${fmt(totalLiveFollow + totalVideoFollow)}</div></div>
                        <div class="stat-card"><div class="label">场均观看</div><div class="value">${fmt(live.length ? live.reduce((s,l)=>s+(l.watch_ucnt||0),0)/live.length : 0)}</div></div>
                    </div>
                </div>
            `;

            // 历史分月统计
            if (history.length) {
                html += `
                    <div class="card">
                        <h2>历史分月统计</h2>
                        <div class="table-wrap"><table>
                            <tr><th>月份</th><th>直播场次</th><th>场均人数</th><th>场均观看</th><th>场均停留(分)</th><th>涨粉总数</th></tr>
                            ${history.slice(0, 12).map(h => `
                                <tr>
                                    <td>${esc(h.month)}</td>
                                    <td>${h.live_count || 0}</td>
                                    <td>${Number(h.avg_acu || 0).toFixed(0)}</td>
                                    <td>${Number(h.avg_watch || 0).toFixed(0)}</td>
                                    <td>${Number(h.avg_duration || 0).toFixed(1)}</td>
                                    <td>${fmt(h.total_follow)}</td>
                                </tr>
                            `).join('')}
                        </table></div>
                    </div>
                `;
            }

            $('monthly-content').innerHTML = html;
        }

        // 初始化月份选择器
        function initMonthSelector() {
            const today = new Date();
            const options = [];
            for (let i = 0; i < 14; i++) {
                const d = new Date(today.getFullYear(), today.getMonth() - i, 1);
                const monthStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
                options.push(`<option value="${monthStr}">${monthStr}</option>`);
            }
            $('month-selector').innerHTML = options.join('');
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            initMonthSelector();
            loadAccounts();
            loadWeeklyReport();
        });
    </script>
</body>
</html>
