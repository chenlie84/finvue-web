<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Markdown 渲染 -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- 代码高亮 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github-dark.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/highlight.min.js"></script>
  <style>
    /* ========== Reset & Variables ========== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-primary: #0f0f13;
      --bg-secondary: #16161d;
      --bg-tertiary: #1e1e28;
      --bg-hover: #252530;
      --surface: #1a1a24;
      --surface-raised: #22222e;
      --border: rgba(255,255,255,0.06);
      --border-active: rgba(124,93,250,0.4);
      --text-primary: #e8e6f0;
      --text-secondary: #9b97b0;
      --text-muted: #6b6880;
      --accent: #7c5dfa;
      --accent-light: #9b7eff;
      --accent-dim: rgba(124,93,250,0.15);
      --gradient-accent: linear-gradient(135deg, #7c5dfa 0%, #a78bfa 50%, #c4b5fd 100%);
      --gradient-bg: linear-gradient(180deg, #0f0f13 0%, #13131a 100%);
      --user-bg: linear-gradient(135deg, #7c5dfa 0%, #6d4de8 100%);
      --assistant-bg: #1e1e28;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.4);
      --shadow-lg: 0 8px 32px rgba(0,0,0,0.5);
      --shadow-glow: 0 0 24px rgba(124,93,250,0.15);
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-xl: 24px;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    html, body {
      height: 100%;
      font-family: var(--font);
      background: var(--gradient-bg);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }

    /* ========== Layout ========== */
    .chat-app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 860px;
      margin: 0 auto;
    }

    /* ========== Header ========== */
    .chat-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 24px;
      background: rgba(15,15,19,0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-avatar {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--gradient-accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
      box-shadow: var(--shadow-glow);
    }

    .header-info h1 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .header-info p {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 1px;
    }

    .header-status {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 8px rgba(74,222,128,0.5);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .header-actions {
      margin-left: auto;
      display: flex;
      gap: 8px;
    }

    .btn-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition);
      font-size: 16px;
    }

    .btn-icon:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
      border-color: var(--border-active);
    }

    /* ========== Messages Area ========== */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      scroll-behavior: smooth;
    }

    .chat-messages::-webkit-scrollbar { width: 5px; }
    .chat-messages::-webkit-scrollbar-track { background: transparent; }
    .chat-messages::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.08);
      border-radius: 10px;
    }
    .chat-messages::-webkit-scrollbar-thumb:hover {
      background: rgba(255,255,255,0.15);
    }

    /* ========== Welcome Screen ========== */
    .welcome-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 40px 20px;
      text-align: center;
    }

    .welcome-icon {
      width: 72px;
      height: 72px;
      border-radius: 22px;
      background: var(--gradient-accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      box-shadow: var(--shadow-glow), var(--shadow-md);
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .welcome-title {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: var(--gradient-accent);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .welcome-subtitle {
      font-size: 14px;
      color: var(--text-secondary);
      max-width: 380px;
      line-height: 1.6;
    }

    .quick-prompts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
      width: 100%;
      max-width: 500px;
    }

    .quick-prompt {
      padding: 14px 16px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-secondary);
      font-size: 13px;
      text-align: left;
      cursor: pointer;
      transition: all var(--transition);
      line-height: 1.4;
    }

    .quick-prompt:hover {
      background: var(--bg-hover);
      border-color: var(--border-active);
      color: var(--text-primary);
      transform: translateY(-2px);
      box-shadow: var(--shadow-glow);
    }

    .quick-prompt .prompt-icon {
      font-size: 16px;
      margin-bottom: 6px;
      display: block;
    }

    /* ========== Message Bubbles ========== */
    .message {
      display: flex;
      gap: 12px;
      max-width: 85%;
      animation: messageIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes messageIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .message.assistant {
      align-self: flex-start;
    }

    .msg-avatar {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      margin-top: 2px;
    }

    .message.user .msg-avatar {
      background: var(--user-bg);
      box-shadow: 0 2px 8px rgba(124,93,250,0.3);
    }

    .message.assistant .msg-avatar {
      background: var(--surface-raised);
      border: 1px solid var(--border);
    }

    .msg-content {
      padding: 12px 16px;
      border-radius: var(--radius-md);
      font-size: 14px;
      line-height: 1.7;
      word-break: break-word;
    }

    .message.user .msg-content {
      background: var(--user-bg);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .message.assistant .msg-content {
      background: var(--assistant-bg);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      color: var(--text-primary);
    }

    /* Markdown 内容样式 */
    .msg-content h1, .msg-content h2, .msg-content h3 {
      margin: 16px 0 8px;
      font-weight: 600;
    }
    .msg-content h1 { font-size: 1.3em; }
    .msg-content h2 { font-size: 1.15em; }
    .msg-content h3 { font-size: 1.05em; }

    .msg-content p { margin: 6px 0; }
    .msg-content p:first-child { margin-top: 0; }
    .msg-content p:last-child { margin-bottom: 0; }

    .msg-content ul, .msg-content ol {
      margin: 8px 0;
      padding-left: 20px;
    }
    .msg-content li { margin: 4px 0; }

    .msg-content code {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 0.88em;
      padding: 2px 6px;
      border-radius: 5px;
      background: rgba(124,93,250,0.12);
      color: var(--accent-light);
    }

    .msg-content pre {
      margin: 10px 0;
      border-radius: var(--radius-sm);
      overflow-x: auto;
      background: #0d1117 !important;
      border: 1px solid var(--border);
    }

    .msg-content pre code {
      display: block;
      padding: 14px;
      background: transparent !important;
      color: #e6edf3;
      font-size: 13px;
      line-height: 1.5;
    }

    .msg-content blockquote {
      border-left: 3px solid var(--accent);
      padding: 4px 12px;
      margin: 8px 0;
      color: var(--text-secondary);
      background: var(--accent-dim);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    }

    .msg-content table {
      border-collapse: collapse;
      margin: 10px 0;
      width: 100%;
      font-size: 13px;
    }
    .msg-content th, .msg-content td {
      border: 1px solid var(--border);
      padding: 8px 12px;
      text-align: left;
    }
    .msg-content th {
      background: var(--surface-raised);
      font-weight: 600;
    }

    .msg-content a {
      color: var(--accent-light);
      text-decoration: none;
    }
    .msg-content a:hover { text-decoration: underline; }

    /* ========== Thinking Block ========== */
    .thinking-block {
      margin: 8px 0;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }

    .thinking-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: rgba(124,93,250,0.06);
      cursor: pointer;
      font-size: 12px;
      color: var(--text-secondary);
      user-select: none;
      transition: background var(--transition);
    }

    .thinking-toggle:hover {
      background: rgba(124,93,250,0.12);
    }

    .thinking-toggle .arrow {
      transition: transform var(--transition);
      font-size: 10px;
    }

    .thinking-toggle.open .arrow {
      transform: rotate(90deg);
    }

    .thinking-content {
      display: none;
      padding: 10px 12px;
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.6;
      background: rgba(0,0,0,0.15);
      border-top: 1px solid var(--border);
    }

    .thinking-content.show {
      display: block;
    }

    /* ========== Typing Indicator ========== */
    .typing-indicator {
      display: flex;
      gap: 5px;
      padding: 8px 4px;
    }

    .typing-indicator span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      animation: typing 1.4s ease-in-out infinite;
    }

    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typing {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-6px); opacity: 1; }
    }

    /* ========== Input Area ========== */
    .chat-input-area {
      padding: 16px 24px 24px;
      background: rgba(15,15,19,0.9);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
    }

    .input-wrapper {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 8px 8px 8px 20px;
      transition: all var(--transition);
    }

    .input-wrapper:focus-within {
      border-color: var(--accent);
      box-shadow: var(--shadow-glow);
    }

    .input-wrapper textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.5;
      resize: none;
      max-height: 150px;
      padding: 8px 0;
    }

    .input-wrapper textarea::placeholder {
      color: var(--text-muted);
    }

    .btn-send {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      border: none;
      background: var(--gradient-accent);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all var(--transition);
      font-size: 18px;
      box-shadow: 0 2px 8px rgba(124,93,250,0.3);
    }

    .btn-send:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 16px rgba(124,93,250,0.5);
    }

    .btn-send:active {
      transform: scale(0.96);
    }

    .btn-send:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    .btn-send.is-stop {
      background: #ef4444;
      box-shadow: 0 2px 8px rgba(239,68,68,0.3);
    }

    .input-hint {
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 8px;
    }

    /* ========== Responsive ========== */
    @media (max-width: 640px) {
      .chat-header { padding: 12px 16px; }
      .chat-messages { padding: 16px; }
      .chat-input-area { padding: 12px 16px 20px; }
      .message { max-width: 92%; }
      .quick-prompts { grid-template-columns: 1fr; }
      .welcome-title { font-size: 22px; }
    }
  </style>
</head>
<body>
  <div class="chat-app" id="chatApp">
    <!-- Header -->
    <header class="chat-header">
      <div class="header-avatar">✦</div>
      <div class="header-info">
        <h1>Qwen 智能助手</h1>
        <div class="header-status">
          <span class="status-dot"></span>
          <p>在线 · qwen3.5-max</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn-icon" id="btnClear" title="清空对话">🗑</button>
      </div>
    </header>

    <!-- Messages -->
    <div class="chat-messages" id="chatMessages">
      <!-- Welcome Screen -->
      <div class="welcome-screen" id="welcomeScreen">
        <div class="welcome-icon">✦</div>
        <h2 class="welcome-title">你好，有什么可以帮你的？</h2>
        <p class="welcome-subtitle">我是基于 Qwen 大模型的智能助手，可以帮你回答问题、写代码、分析数据等。</p>
        <div class="quick-prompts">
          <button class="quick-prompt" onclick="sendQuickPrompt(this)">
            <span class="prompt-icon">💡</span>
            用 Python 写一个快速排序算法
          </button>
          <button class="quick-prompt" onclick="sendQuickPrompt(this)">
            <span class="prompt-icon">📊</span>
            解释什么是数据可视化的最佳实践
          </button>
          <button class="quick-prompt" onclick="sendQuickPrompt(this)">
            <span class="prompt-icon">✍️</span>
            帮我写一封商务邮件
          </button>
          <button class="quick-prompt" onclick="sendQuickPrompt(this)">
            <span class="prompt-icon">🔍</span>
            SQL 查询优化有哪些常用技巧？
          </button>
        </div>
      </div>
    </div>

    <!-- Input -->
    <div class="chat-input-area">
      <div class="input-wrapper">
        <textarea
          id="chatInput"
          rows="1"
          placeholder="输入你的问题..."
          autofocus
        ></textarea>
        <button class="btn-send" id="btnSend" title="发送">▲</button>
      </div>
      <div class="input-hint">Enter 发送 · Shift+Enter 换行</div>
    </div>
  </div>

  <script>
    // ========== Config ==========
    const API_URL = '/api/chat';

    // ========== State ==========
    let messages = [];
    let isStreaming = false;
    let abortController = null;

    // ========== DOM ==========
    const chatMessages = document.getElementById('chatMessages');
    const chatInput = document.getElementById('chatInput');
    const btnSend = document.getElementById('btnSend');
    const btnClear = document.getElementById('btnClear');
    const welcomeScreen = document.getElementById('welcomeScreen');

    // ========== Marked Config ==========
    marked.setOptions({
      highlight: function(code, lang) {
        if (lang && hljs.getLanguage(lang)) {
          return hljs.highlight(code, { language: lang }).value;
        }
        return hljs.highlightAuto(code).value;
      },
      breaks: true,
    });

    // ========== Auto-resize textarea ==========
    chatInput.addEventListener('input', () => {
      chatInput.style.height = 'auto';
      chatInput.style.height = Math.min(chatInput.scrollHeight, 150) + 'px';
    });

    // ========== Keyboard ==========
    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (!isStreaming) handleSend();
      }
    });

    // ========== Buttons ==========
    btnSend.addEventListener('click', () => {
      if (isStreaming) {
        handleStop();
      } else {
        handleSend();
      }
    });

    btnClear.addEventListener('click', () => {
      messages = [];
      chatMessages.innerHTML = '';
      chatMessages.appendChild(welcomeScreen);
      welcomeScreen.style.display = 'flex';
    });

    // ========== Quick Prompts ==========
    function sendQuickPrompt(btn) {
      const text = btn.textContent.replace(btn.querySelector('.prompt-icon').textContent, '').trim();
      chatInput.value = text;
      handleSend();
    }

    // ========== Send Message ==========
    async function handleSend() {
      const content = chatInput.value.trim();
      if (!content) return;

      // Hide welcome
      welcomeScreen.style.display = 'none';

      // Add user message
      messages.push({ role: 'user', content });
      appendMessage('user', content);

      // Clear input
      chatInput.value = '';
      chatInput.style.height = 'auto';

      // Stream response
      await streamResponse();
    }

    // ========== Stop Streaming ==========
    function handleStop() {
      if (abortController) {
        abortController.abort();
        abortController = null;
      }
      setStreaming(false);
    }

    // ========== Streaming State ==========
    function setStreaming(active) {
      isStreaming = active;
      btnSend.disabled = false;
      if (active) {
        btnSend.innerHTML = '■';
        btnSend.classList.add('is-stop');
        btnSend.title = '停止生成';
      } else {
        btnSend.innerHTML = '▲';
        btnSend.classList.remove('is-stop');
        btnSend.title = '发送';
      }
    }

    // ========== Append Message ==========
    function appendMessage(role, content) {
      const div = document.createElement('div');
      div.className = `message ${role}`;

      const avatar = role === 'user' ? '👤' : '✦';
      const rendered = role === 'assistant' ? renderMarkdown(content) : escapeHtml(content);

      div.innerHTML = `
        <div class="msg-avatar">${avatar}</div>
        <div class="msg-content">${rendered}</div>
      `;
      chatMessages.appendChild(div);
      scrollToBottom();
      return div;
    }

    // ========== Stream Response ==========
    async function streamResponse() {
      setStreaming(true);
      abortController = new AbortController();

      // Create assistant message bubble
      const msgDiv = appendMessage('assistant', '');
      const contentEl = msgDiv.querySelector('.msg-content');

      // Show typing indicator
      contentEl.innerHTML = `<div class="typing-indicator"><span></span><span></span><span></span></div>`;

      let fullContent = '';
      let thinkingContent = '';
      let isThinking = false;

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages }),
          signal: abortController.signal,
        });

        if (!response.ok) {
          const err = await response.json().catch(() => ({}));
          throw new Error(err.detail || `HTTP ${response.status}`);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop() || '';

          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            const data = line.slice(6).trim();
            if (data === '[DONE]') continue;

            try {
              const parsed = JSON.parse(data);
              const delta = parsed.choices?.[0]?.delta;
              if (!delta) continue;

              // Handle reasoning/thinking content
              const reasoning = delta.reasoning_content || delta.reasoning || '';
              if (reasoning) {
                isThinking = true;
                thinkingContent += reasoning;
                renderStreamContent(contentEl, thinkingContent, fullContent, true);
              }

              // Handle main content
              const text = delta.content || '';
              if (text) {
                if (isThinking) {
                  isThinking = false;
                }
                fullContent += text;
                renderStreamContent(contentEl, thinkingContent, fullContent, false);
              }
            } catch {}
          }
        }
      } catch (err) {
        if (err.name !== 'AbortError') {
          fullContent += `\n\n⚠️ 请求出错: ${err.message}`;
          renderStreamContent(contentEl, thinkingContent, fullContent, false);
        }
      }

      // Save assistant response
      if (fullContent) {
        messages.push({ role: 'assistant', content: fullContent });
      }

      setStreaming(false);
      abortController = null;
      scrollToBottom();
    }

    // ========== Render Streaming Content ==========
    function renderStreamContent(el, thinking, content, isCurrentlyThinking) {
      let html = '';

      // Thinking block
      if (thinking) {
        const thinkingLabel = isCurrentlyThinking ? '思考中...' : '思考过程';
        html += `<div class="thinking-block">
          <div class="thinking-toggle" onclick="this.classList.toggle('open'); this.nextElementSibling.classList.toggle('show')">
            <span class="arrow">▶</span> 💭 ${thinkingLabel}
          </div>
          <div class="thinking-content">${renderMarkdown(thinking)}</div>
        </div>`;
      }

      // Main content
      if (content) {
        html += renderMarkdown(content);
      } else if (isCurrentlyThinking) {
        // Show typing indicator while only thinking
        html += html ? '' : `<div class="typing-indicator"><span></span><span></span><span></span></div>`;
      }

      if (!html) {
        html = `<div class="typing-indicator"><span></span><span></span><span></span></div>`;
      }

      el.innerHTML = html;
      scrollToBottom();
    }

    // ========== Render Markdown ==========
    function renderMarkdown(text) {
      if (!text) return '';
      try {
        return marked.parse(text);
      } catch {
        return escapeHtml(text);
      }
    }

    // ========== Utils ==========
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function scrollToBottom() {
      requestAnimationFrame(() => {
        chatMessages.scrollTop = chatMessages.scrollHeight;
      });
    }
  </script>
</body>
</html>
